rid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px;border-top:1px solid var(--bd);flex:0 0 auto;background:var(--pn)}.mail-compose select{min-width:0;width:100%;max-width:none}.mail-compose textarea{grid-column:1/-1;resize:none;height:66px;box-sizing:border-box;width:100%;display:block}.mail-empty{text-align:center;padding:28px 12px;color:var(--mu)}.mail-box.mail-preview{height:auto;max-height:265px;animation:mailReveal .5s ease-out both}.mail-preview .mail-body{flex:0 0 auto;max-height:150px;overflow:hidden}.mail-preview .mail-compose{display:none}.mail-preview-actions{display:flex;justify-content:flex-end;padding:0 9px 9px}.mail-preview-actions button{font-size:11px}@keyframes mailReveal{from{opacity:0;transform:translateY(12px) scale(.97);transform-origin:bottom left}to{opacity:1;transform:translateY(0) scale(1)}}

async function actualizarRealtime(tabla){
 if(Date.now()<RT.ignoreUntil)return;
 if(RT.mutating||RT.working||DRG){RT.pending=true;acumularTablasRealtime(tabla);return}
 RT.working=true;
 try{
  const tablas=String(tabla||'').split(',').map(x=>x.trim()).filter(Boolean);
  const tiene=(...n)=>tablas.some(t=>n.includes(t));
  const solo=(...n)=>tablas.length>0&&tablas.every(t=>n.includes(t));
  const permisos=tiene('perfiles','perfiles_edificios','perfiles_permisos_edicion','edificios');
  if(permisos){
   const pe=await cargarPermisosEdificios();
   if(!pe)return;
   const ok=await cargarPermisosEdicion();
   if(ok===false)return;
  }
  if(S.perfil?.rol==='limpieza'){
   if(!tablas.length||tiene('limpieza','reservas','unidades','edificios','perfiles_edificios','perfiles')){
    await tareasLimp();
   }
   return;
  }
  if(solo('configuracion')){
   const {data,error}=await cacheMemoria('pms:configuracion:'+S.perfil.id,30000,()=>sb.from('configuracion').select('clave,valor'));
   if(error)throw error;
   S.cfg=Object.fromEntries((data||[]).map(x=>[x.clave,x.valor]));
   const grid=$('#gw'),scroll=grid?grid.scrollLeft:null;
   dibujar();
   if(grid&&Number.isFinite(scroll))grid.scrollLeft=scroll;
   return;
  }
  // Un cambio de limpieza no necesita volver a consultar reservas, huéspedes,
  // saldos ni unidades: actualiza únicamente los datos de limpieza y redibuja.
  if(solo('limpieza')){
   await refrescarLimpiezaGrid();
   return;
  }
  // Pagos y cargos solo cambian saldos/garantías de la cuadrícula. No reconstruir
  // la ficha si hay cambios sin guardar en el formulario abierto.
  if(solo('pagos','pagos_motivos','cargos')){
   await refrescarSaldosGrid();
   if($('#hosp').style.display==='flex')await hosCargar();
   if(detallePuedeActualizarseSinPerderEdicion())await abrirDr(S.cur.id);
   return;
  }
  // Cambios de huéspedes, acompañantes y notas solo afectan la ficha abierta.
  // No deben forzar una recarga del calendario completo.
  if(solo('huespedes','acompanantes','notas_huesped')){
   if(detallePuedeActualizarseSinPerderEdicion())await abrirDr(S.cur.id);
   return;
  }
  // Cambios de fechas de estacionamiento no exigen recargar todo el calendario.
  if(solo('estacionamiento_reserva_fechas')){
   if($('#est').style.display==='flex')await estCargar();
   if(detallePuedeActualizarseSinPerderEdicion())await abrirDr(S.cur.id);
   return;
  }

  // Las reservas, unidades y permisos afectan la ocupación o el alcance visible;
  // en esos casos se conserva la recarga de datos necesaria, pero no se pisa
  // un formulario editado localmente ni se refrescan paneles ajenos al evento.
  await cargar();
  if($('#est').style.display==='flex'&&tiene('reservas','unidades','edificios','estacionamiento_reserva_fechas'))await estCargar();
  if($('#hosp').style.display==='flex'&&tiene('reservas','unidades','edificios','perfiles','perfiles_edificios'))await hosCargar();
  if($('#cat').style.display==='flex'&&tiene('unidades','edificios'))await catDibujar();
  if($('#aud').style.display==='flex'&&tiene('reservas','pagos','cargos','limpieza','unidades'))await audCargar(true);
  if(detallePuedeActualizarseSinPerderEdicion())await abrirDr(S.cur.id);
 }finally{
  RT.working=false;
  drenarRealtime();
 }
}

function protegerMutacionesRealtime(){
 const nombres=[
  'guardarNueva','guardarEditorReserva','marcarPagadaHistorica','guardarPermisosEdicion','guardarCambiosReservaDetalle','accion',
  'guardarReclamo','hacerCheckOut','guardarR','guardarG','notaNueva','addAc','delAc','addCargo','addPago',
  'cambiarLimp','marcarSucia','gd','nw','guardarRanking','gCfg','guardarPermisos','borrarU',
  'addGarantia','omitirGarantia','reactivarGarantia','moverReserva','extenderReservaDesdeArrastre','gAplicar','gQuitarFecha','gDet',
  'guardarRankingFotos','subirFotos','delFoto','borrarReserva','bDelR','bDelH','bDelTodos'
 ];
 // Evita ejecuciones concurrentes de la misma mutación en esta pestaña.
 // No sustituye una clave de idempotencia en el servidor para reintentos entre sesiones.
 const enCurso=new Set();
 for(const nombre of nombres){
  const fn=window[nombre];
  if(typeof fn!=='function'||fn.__pmsRtWrapped)continue;
  const env=function(...args){
   if(enCurso.has(nombre))return false;
   enCurso.add(nombre);
   const botones=[...document.querySelectorAll('button[onclick]')]
    .filter(b=>(b.getAttribute('onclick')||'').includes(nombre+'('));
   const estadoBotones=botones.map(b=>({
    boton:b,
    disabled:b.disabled,
    ariaBusy:b.getAttribute('aria-busy')
   }));
   estadoBotones.forEach(({boton})=>{
    boton.disabled=true;
    boton.setAttribute('aria-busy','true');
   });
   RT.mutating++;
   let finalizado=false;
   const finalizar=()=>{
    if(finalizado)return;
    finalizado=true;
    enCurso.delete(nombre);
    estadoBotones.forEach(({boton,disabled,ariaBusy})=>{
     if(!boton.isConnected)return;
     boton.disabled=disabled;
     if(ariaBusy===null)boton.removeAttribute('aria-busy');
     else boton.setAttribute('aria-busy',ariaBusy);
    });
    RT.mutating=Math.max(0,RT.mutating-1);
    drenarRealtime();
   };
   let out;
   try{out=fn.apply(this,args)}
   catch(e){finalizar();throw e}
   if(out&&typeof out.then==='function')return Promise.resolve(out).finally(finalizar);
   finalizar();
   return out;
  };
  env.__pmsRtWrapped=true;
  window[nombre]=env;
 }
}

async function cargar(op={}){
 const cargaId=++CARGA_GRID_SEQ;
 const fin=addD(S.ini,ND);
 $('#hf').value=S.vista||S.ini;
 const edIds=S.edificiosPermitidos.map(e=>e.id);
 if(!edIds.length){
  if(cargaId!==CARGA_GRID_SEQ)return;
  S.unidades=[];S.res=[];S.lim={};S.gar={};S.saldo={};S.lh={};S.tipos={};
  $('#bar').innerHTML='<span class="mu">No tienes edificios asignados para visualizar. Administración → Usuarios → Permisos de edificios.</span>';
  const g0=$('#gw'),live0=g0?g0.scrollLeft:null;
  dibujar();
  if(Number.isFinite(live0))$('#gw').scrollLeft=live0;
  return;
 }

 // Lanzar las consultas independientes juntas reduce la cascada de red.
 // Limpieza y saldos empiezan tan pronto como llega su dependencia.
 const cacheUnidadesKey='pms:catalogos:unidades:'+S.perfil.id+':'+edIds.slice().sort().join(',');
 const unidadesPromise=cacheMemoria(cacheUnidadesKey,30000,()=>sb.from('unidades').select('id,codigo,orden,edificio_id,tipo_unidad_id,edificios(nombre,orden,requiere_documento),tipos_unidad(nombre,tarifa_base)').eq('activo',true).in('edificio_id',edIds));
 const reservasPromise=sb.from('reservas').select('*,huespedes(uid_huesped),unidad_filtro:unidades!inner(id,edificio_id,activo)').in('unidad_filtro.edificio_id',edIds).eq('unidad_filtro.activo',true).lt('fecha_entrada',fin).gt('fecha_salida',S.ini).not('estado','in','(cancelada,no_show)');
 const limpiezaHistorialPromise=sb.rpc('limpieza_grilla',{p_desde:addD(hoyStr(),-2)});
 const limpiezaActualPromise=unidadesPromise.then(ur=>{
  if(ur?.error)return {data:null,error:ur.error};
  const ids=(ur?.data||[]).map(u=>u.id);
  return ids.length?sb.from('estado_limpieza_actual').select('*').in('unidad_id',ids):Promise.resolve({data:[],error:null});
 });
 const saldosPromise=reservasPromise.then(async rr=>{
  if(rr?.error)return {sv:{data:null,error:rr.error},gp:{data:[],error:null}};
  const ids=(rr.data||[]).map(x=>x.id);
  if(!ids.length)return {sv:{data:[],error:null},gp:{data:[],error:null}};
  const [sv,gp]=await Promise.all([
   sb.from('saldo_reserva').select('reserva_id,total_a_pagar,total_pagado').in('reserva_id',ids),
   sb.from('garantia_reserva').select('reserva_id,monto,pagado').eq('requiere',true).eq('omitida',false).in('estado',['tentativa','confirmada','en_casa']).in('reserva_id',ids)
  ]);
  return {sv,gp};
 });

 let unidadResult,reservaResult,limpiezaResult,lh,saldoPack;
 try{
  [unidadResult,reservaResult,limpiezaResult,lh,saldoPack]=await Promise.all([
   unidadesPromise,reservasPromise,limpiezaActualPromise,limpiezaHistorialPromise,saldosPromise
  ]);
 }catch(e){
  if(cargaId===CARGA_GRID_SEQ)msg(e?.message||'No se pudieron cargar los datos del calendario',1);
  return;
 }
 if(cargaId!==CARGA_GRID_SEQ)return;
 if(unidadResult?.error)return msg(unidadResult.error.message,1);
 if(reservaResult?.error)return msg(reservaResult.error.message,1);
 if(limpiezaResult?.error)return msg(limpiezaResult.error.message,1);
 if(saldoPack?.sv?.error||saldoPack?.gp?.error)return msg((saldoPack.sv.error||saldoPack.gp.error).message,1);

 S.unidades=(unidadResult.data||[]).sort((a,b)=>(a.edificios.orden-b.edificios.orden)||(a.orden-b.orden)||a.codigo.localeCompare(b.codigo,'es',{numeric:true}));
 const uids=S.unidades.map(x=>x.id);
 S.tipos={};S.unidades.forEach(u=>S.tipos[u.tipo_unidad_id||'']=Object.assign({},u.tipos_unidad||{nombre:'Sin categoría',tarifa_base:0},{ed:u.edificios.nombre}));
 S.res=reservaResult.data||[];
 S.gar=Object.fromEntries((saldoPack.gp.data||[]).filter(x=>x.pagado<x.monto).map(x=>[x.reserva_id,1]));
 S.saldo=Object.fromEntries((saldoPack.sv.data||[]).map(x=>[x.reserva_id,{total:+x.total_a_pagar||0,pagado:+x.total_pagado||0}]));
 S.lim=Object.fromEntries((limpiezaResult.data||[]).map(x=>[x.unidad_id,x]));
 S.lh={};
 if(lh.error){if(!S.lhMsg){S.lhMsg=1;msg('Falta correr el SQL de limpieza: '+lh.error.message,1)}}else(lh.data||[]).filter(x=>uids.includes(x.unidad_id)).forEach(x=>(S.lh[x.unidad_id]=S.lh[x.unidad_id]||[]).push(x));
 Object.values(S.lh).forEach(a=>a.sort((p,q)=>Date.parse(p.creado_en)-Date.parse(q.creado_en)));
 const gBeforeDraw=$('#gw'),liveScroll=gBeforeDraw?gBeforeDraw.scrollLeft:null;
 dibujar();
 let target=null;
 if(Number.isFinite(op.scrollDelta))target=Math.max(0,(Number.isFinite(liveScroll)?liveScroll:0)+op.scrollDelta);
 else if(Number.isFinite(op.scrollAnchor))target=op.scrollAnchor;
 else if(Number.isFinite(liveScroll))target=liveScroll;
 if(Number.isFinite(target))$('#gw').scrollLeft=target;
}

function esVistaMovil(){return !!(window.matchMedia&&window.matchMedia('(max-width: 900px)').matches)}
function actualizarModoMovil(){const m=esVistaMovil()&&!!S.perfil&&rolNormalizado(S.perfil.rol)!=='limpieza';document.body.classList.toggle('mobile-pms',m);const d=$('#mobileDate');if(d)d.value=S.vista||hoyStr()}
function mobileIrFecha(v){
 if(!v)return;
 if(esRecepcion()&&v<(S.recepMin||S.ini)){
  const d=$('#mobileDate');if(d)d.value=S.vista||hoyStr();
  return msg('Recepción no puede desplazarse antes del rango inicial cargado.',1);
 }
 const hf=$('#hf');if(hf)hf.value=v;
 S.vista=v;S.sel=null;
 const rangoFin=addD(S.ini,ND);
 if(esRecepcion()){
  // Recepción conserva el inicio cargado y solo amplía el calendario hacia el futuro.
  const diasHastaFecha=diff(S.ini,v);
  const nuevoND=Math.max(ND,diasHastaFecha+MOBILE_CAL_BATCH+7);
  if(nuevoND!==ND||v<S.ini||v>=rangoFin){
   ND=nuevoND;
   MOBILE_DAY_SCROLL=Math.max(0,(diasHastaFecha-3)*79);
   MOBILE_PRESERVE_NEXT=true;
   cargar();
  }else dibujar();
 }else if(v<S.ini||v>=rangoFin){
  S.ini=addD(v,-15);ND=31;MOBILE_DAY_SCROLL=12*79;MOBILE_PRESERVE_NEXT=true;
  cargar();
 }else if(addD(v,7)>rangoFin){
  while(addD(v,7)>addD(S.ini,ND))ND+=MOBILE_CAL_BATCH;
  cargar();
 }else dibujar();
 const d=$('#mobileDate');if(d)d.value=S.vista||hoyStr();
}

function dibujarMovil(){
 const inicio=S.vista||hoyStr(),fin=addD(inicio,7),dt0=new Date(inicio+'T00:00:00Z');
 const scrollAnterior=$('#gw')?.querySelector('.mobile-days')?.scrollLeft;
 if(Number.isFinite(scrollAnterior)&&!MOBILE_PRESERVE_NEXT)MOBILE_DAY_SCROLL=scrollAnterior;
 if(MOBILE_PRESERVE_NEXT)MOBILE_PRESERVE_NEXT=false;
 const rango=dt0.toLocaleDateString('es-CL',{day:'2-digit',month:'short',timeZone:'UTC'})+' – '+new Date(addD(inicio,6)+'T00:00:00Z').toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
 const edificios=(S.edificiosPermitidos||[]).filter(e=>S.unidades.some(u=>u.edificio_id===e.id)).slice().sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre,'es'));

async function ampliarVentanaCalendario(dir){

 if(dir<0){

 }

function cambiarFechaGrid(v){

function revisarBordeCalendario(){
 const g=$('#gw');if(!g||EDGE.loading||DRG)return;
 if(esRecepcion()&&g.scrollLeft<=EDGE_TRIGGER_DAYS*W){
  if(g.scrollLeft<0)g.scrollLeft=0;
  return;
 }
 const max=Math.max(0,g.scrollWidth-g.clientWidth);
 const umbral=EDGE_TRIGGER_DAYS*W;

  const v=parseFloat(total.value); if(Number.isFinite(v)) tarifa.value=(v/noches).toFixed(0);

  const v=parseFloat(tarifa.value); if(Number.isFinite(v)) total.value=Math.round(v*noches);
 }
}

async function consultarDisponibilidad(){
 const fe=$('#ad_ent')?.value,fs=$('#ad_sal')?.value,out=$('#ad_result');
 if(!fe||!fs||fs<=fe)return msg('La salida debe ser posterior a la entrada',1);
 const boton=[...document.querySelectorAll('#mo button')].find(b=>b.getAttribute('onclick')==='consultarDisponibilidad()');

 out.innerHTML='<div class="al">⏳ Buscando disponibilidad y evaluando reacomodaciones inteligentes…</div>';
 try{
  let salida=fs,resultado=[],errorBusqueda=null;
  const salidaMinima=addD(fe,1);
  while(salida>fe){
   out.innerHTML='<div class="al">⏳ Revisando del <b>'+esc(fechaDisponibilidadLarga(fe))+'</b> al <b>'+esc(fechaDisponibilidadLarga(salida))+'</b> con los filtros seleccionados y reacomodación inteligente…</div>';
   const {data,error}=await sb.rpc('buscar_disponibilidad_global',{p_entrada:fe,p_salida:salida});
   if(error){errorBusqueda=error;break}
   const todos=Array.isArray(data)?data:(data&&typeof data==='object'?[data]:[]);
   resultado=filtrarResultadosDisponibilidad(todos);
   if(resultado.length)break;
   if(salida===salidaMinima)break;
   salida=addD(salida,-1);
  }
  if(errorBusqueda){
   out.innerHTML='<div class="al r">No se pudo completar la búsqueda: '+esc(errTxt(errorBusqueda))+'<br><span class="mu">No se mostrarán resultados parciales porque no se pudo verificar toda la búsqueda.</span></div>';
   return;
  }
  if(!resultado.length){
   out.innerHTML='<div class="al r"><b>✕ No se encontró disponibilidad</b><br>Se revisaron todos los períodos posibles, desde la salida solicitada hasta una estadía de una noche, con los filtros seleccionados, disponibilidad directa y reacomodación inteligente.</div>';
   return;
  }
  const parcial=salida!==fs;
  const titulo=parcial
   ?'<div class="al"><b>⚠ No hay disponibilidad hasta el '+esc(fechaDisponibilidadLarga(fs))+'</b><br>Pero sí hay disponibilidad desde el <b>'+esc(fechaDisponibilidadLarga(fe))+'</b> hasta el <b>'+esc(fechaDisponibilidadLarga(salida))+'</b>. La estadía encontrada es de '+diff(fe,salida)+' noche'+(diff(fe,salida)===1?'':'s')+'.</div>'
   :'<div class="al" style="border-left-color:#16a34a;background:rgba(22,163,74,.08)"><b>✓ Disponibilidad para todo el período solicitado</b><br>Del '+esc(fechaDisponibilidadLarga(fe))+' al '+esc(fechaDisponibilidadLarga(fs))+'.</div>';
  out.innerHTML=titulo+renderOpcionesDisponibilidad(resultado,fe,fs,salida);
 }catch(e){
  out.innerHTML='<div class="al r">Ocurrió un error al buscar disponibilidad: '+esc(e?.message||e)+'</div>';
 }finally{
  if(boton){boton.disabled=false;boton.textContent=boton.dataset.originalText||'Buscar disponibilidad';boton.style.background='';boton.style.color='';}
 }
}

async function guardarFechasParking(reservaId,dates,permitirSobrecupo=false){
 const expected=[...new Set((dates||[]).filter(Boolean).map(d=>String(d).slice(0,10)))].sort();
 const {error:rpcError}=await sb.rpc('guardar_fechas_estacionamiento',{
  p_fechas:expected,p_reserva_id:reservaId,p_permitir_sobrecupo:!!permitirSobrecupo
 });
 if(rpcError)return rpcError;
 // La comprobación se basa en las filas persistidas, no en el formato del retorno RPC.
 const {data:rows,error:readError}=await sb.from('estacionamiento_reserva_fechas')
  .select('fecha').eq('reserva_id',reservaId).order('fecha');
 if(readError)return new Error('El guardado se ejecutó, pero no se pudieron releer las fechas de estacionamiento: '+readError.message);
 const actual=[...new Set((rows||[]).map(x=>String(x.fecha??'').slice(0,10)).filter(Boolean))].sort();
 if(JSON.stringify(actual)!==JSON.stringify(expected))
  return new Error('Verificación de estacionamiento fallida. Seleccionadas: '+(expected.join(', ')||'(ninguna)')+'; persistidas: '+(actual.join(', ')||'(ninguna)'));
 const {data:parent,error:parentError}=await sb.from('reservas')
  .select('usa_estacionamiento,noches_estacionamiento,fecha_entrada,fecha_salida')
  .eq('id',reservaId).maybeSingle();
 if(parentError)return new Error('Las fechas se releen correctamente, pero no se pudo verificar la reserva: '+parentError.message);
 if(!parent)return new Error('Las fechas se releen correctamente, pero la reserva ya no aparece en reservas.');
 if(Number(parent.noches_estacionamiento||0)!==expected.length)
  return new Error('Las fechas quedaron guardadas, pero noches_estacionamiento indica '+Number(parent.noches_estacionamiento||0)+' y existen '+expected.length+' fecha(s).');
 if(expected.some(d=>d<parent.fecha_entrada||d>=parent.fecha_salida))
  return new Error('Las fechas persistidas no coinciden con la estadía actual ('+parent.fecha_entrada+' a '+parent.fecha_salida+').');
 if(expected.length>0&&!parent.usa_estacionamiento)
  return new Error('Hay fechas guardadas, pero la reserva figura con usa_estacionamiento=false.');
 return null;
}
async function avisoCupoFechas(ed,dates,excl){
 const selected=[...new Set((dates||[]).filter(Boolean).map(d=>String(d).slice(0,10)))].sort();
 if(!selected.length)return {permitirSobrecupo:false};
 const uids=S.unidades.filter(u=>u.edificio_id===ed).map(u=>u.id);
 if(!ed||!uids.length){msg('No se pudo determinar el edificio/unidades para comprobar el cupo de estacionamiento.',1);return null}
 const {data:rsv,error:re}=await sb.from('reservas')
  .select('id,fecha_entrada,fecha_salida,noches_estacionamiento,huesped_nombre_copia')
  .eq('usa_estacionamiento',true).in('unidad_id',uids).in('estado',['tentativa','confirmada','en_casa'])
  .lt('fecha_entrada',addD(selected[selected.length-1],1)).gt('fecha_salida',selected[0])
  .neq('id',excl||'00000000-0000-0000-0000-000000000000');
 if(re){msg('No se pudo comprobar el cupo de estacionamiento: '+re.message,1);return null}
 const candidates=(rsv||[]).filter(r=>selected.some(d=>d>=r.fecha_entrada&&d<r.fecha_salida));
 const ids=candidates.map(x=>x.id);
 const {data:fd,error:fe}=ids.length
  ?await sb.from('estacionamiento_reserva_fechas').select('reserva_id,fecha').in('reserva_id',ids)
  :{data:[],error:null};
 if(fe){msg('No se pudieron leer las noches de estacionamiento ya asignadas: '+fe.message,1);return null}
 const byId=Object.create(null);
 (fd||[]).forEach(x=>(byId[x.reserva_id]||(byId[x.reserva_id]=[])).push(String(x.fecha).slice(0,10)));
 const incompletas=candidates.filter(r=>{
  const f=[...new Set(byId[r.id]||[])],expected=Math.max(0,Number(r.noches_estacionamiento)||0);
  return f.length!==expected||f.some(d=>d<r.fecha_entrada||d>=r.fecha_salida);
 });
 if(incompletas.length){
  const detalle=incompletas.slice(0,5).map(r=>(r.huesped_nombre_copia||r.id)+' ('+(byId[r.id]||[]).length+'/'+Math.max(0,Number(r.noches_estacionamiento)||0)+' fechas)').join('; ');
  msg('No se puede comprobar la disponibilidad con seguridad: hay reservas con fechas de estacionamiento incompletas o fuera de su estadía. Corrige primero: '+detalle+(incompletas.length>5?' y '+(incompletas.length-5)+' más.':'.'),1);
  return null;
 }
 const {data:edif,error:ee}=await sb.from('edificios').select('cupos_estacionamiento').eq('id',ed).maybeSingle();
 if(ee){msg('No se pudo leer la capacidad de estacionamiento: '+ee.message,1);return null}
 const cap=Number(edif?.cupos_estacionamiento)||0;
 if(!cap)return confirm('Este edificio no tiene cupos de estacionamiento definidos. Si continúas, se registrará igualmente el estacionamiento. ¿Continuar?')
  ?{permitirSobrecupo:true}:null;
 const counts=Object.create(null);
 (fd||[]).forEach(x=>{const d=String(x.fecha).slice(0,10);if(selected.includes(d))counts[d]=(counts[d]||0)+1});
 const full=selected.find(d=>(counts[d]||0)>=cap);
 if(full)return confirm('No quedan cupos de estacionamiento la noche del '+fm(full)+' (hay '+cap+' en total). ¿Confirmas igualmente el sobrecupo?')
  ?{permitirSobrecupo:true}:null;
 return {permitirSobrecupo:false};
}

function actualizarModoNueva(){

 if(panel)panel.style.display=bloqueo?'none':'';
 if(nr)nr.style.display='block';

 if(title)title.textContent=bloqueo?'Nuevo bloqueo':'Nueva reserva individual';
 if(subtitle)subtitle.textContent=bloqueo?'Bloquea la unidad seleccionada para las fechas indicadas. No se requiere huésped.':'Selecciona un huésped o crea uno nuevo';

async function cancelarReservaFallbackPMS(r,motivo){
 const motivoLimpio=String(motivo||'').trim();
 if(!motivoLimpio)return {ok:false,error:new Error('Debes indicar el motivo de cancelación')};

 // El RPC seguro puede existir en Supabase y aun así estar desactualizado.
 // Nunca damos éxito hasta comprobar el estado real del registro.
 const rpc=await sb.rpc('cancelar_reserva_pms_v1101',{
  p_reserva_id:r.id,p_motivo:motivoLimpio
 });
 let rpcCargo=0;
 if(!rpc.error)rpcCargo=Number(rpc.data)||0;

 const comprobar=async()=>{
  const {data,error}=await sb.from('reservas').select('id,estado')
   .eq('id',r.id).maybeSingle();
  if(error)return {error:new Error('No se pudo verificar la cancelación: '+error.message)};
  if(data?.estado==='cancelada')return {ok:true,cargo:rpcCargo};
  return {data};
 };
 const primera=await comprobar();
 if(primera.error)return {ok:false,error:primera.error};
 if(primera.ok)return primera;

 // Si el RPC devolvió éxito sin cambiar la fila, o no existe en la instalación,
 // usar una actualización condicionada al estado válido y verificarla otra vez.
 const {data,error}=await sb.from('reservas').update({
  estado:'cancelada',
  cancelada_en:new Date().toISOString(),
  cancelada_por:S.perfil?.id||null,
  motivo_cancelacion:motivoLimpio
 }).eq('id',r.id).in('estado',['tentativa','confirmada'])
   .select('id,estado').maybeSingle();

 if(error)return {ok:false,error:new Error(
  'No se pudo cancelar mediante el RPC'+(rpc.error?' ('+rpc.error.message+')':'')+
  ' ni mediante la actualización compatible ('+error.message+').'
 )};
 if(data?.estado==='cancelada')return {ok:true,cargo:rpcCargo};

 const final=await comprobar();
 if(final.error)return {ok:false,error:final.error};
 if(final.ok)return final;
 return {ok:false,error:new Error(
  'La cancelación no modificó el registro. Estado actual: '+
  String(final.data?.estado||'reserva no encontrada')+
  (rpc.error?'. Error RPC: '+rpc.error.message:'. El RPC terminó sin error, pero no cambió el estado.')
 )};
}
async function accion(k){
 const r0=S.cur;if(!r0)return;
 let cancelacionFallback=false,cargoCancelacion=null,motivoCancelacionUsado=null,cancelacionPreSaveFallida=false;
 // Guardar la ficha antes de una acción solo si realmente hay cambios.
 // Antes el guardado integral se ejecutaba en cada clic y podía bloquear
 // cancelar/check-in/no-show por una validación ajena a la acción.
 if(k!=='del'&&$('#dr').style.display==='block'&&$('#gname')&&formularioReservaModificado(r0.id)){
  const ok=await guardarCambiosReservaDetalle({silencioso:true});
  if(!ok){
   if(k!=='can')return;
   // No dejar bloqueada la cancelación por un campo editado que no pudo guardarse.
   cancelacionPreSaveFallida=true;
  }
 }
 // Las acciones críticas deben trabajar con el estado REAL de Supabase,
 // no con una copia que pudo quedar desactualizada en S.cur.
 let r=r0;
 if(k!=='del'){
  const {data:actual,error:er}=await sb.from('reservas').select('*').eq('id',r0.id).maybeSingle();
  if(er)return msg('No se pudo verificar el estado actual de la reserva: '+er.message,1);
  if(!actual)return msg('La reserva ya no existe',1);
  r=actual;S.cur={...S.cur,...actual};
 }
 let e;
 if(k==='in'){
  if(r.estado!=='confirmada'){
   await abrirDr(r.id);
   return msg('La reserva no está confirmada. Estado actual: '+String(r.estado||'sin estado').replace('_',' '),1);
  }
  const ck=await sb.rpc('hacer_check_in',{p_reserva_id:r.id});
  e=ck.error;
  // Compatibilidad con instalaciones donde el RPC antiguo quedó desactualizado.
  // Si Supabase confirma que la reserva REAL está confirmada, ejecutamos el cambio
  // directamente para no bloquear el check-in por una validación defectuosa del RPC.
  if(e && /reserva no (está|esta) confirmada/i.test(e.message||'') && r.estado==='confirmada'){
   const fb=await sb.from('reservas').update({estado:'en_casa',entrada_real:new Date().toISOString()}).eq('id',r.id).eq('estado','confirmada').select('id').maybeSingle();
   e=fb.error;
   if(!e&&!fb.data)e=new Error('La reserva cambió de estado antes de completar el check-in');
  }
 }
 if(k==='out')return abrirCheckOut();
 if(k==='can'){
  const m=prompt('Motivo de la cancelación:');
  if(m===null)return;
  motivoCancelacionUsado=m.trim();
  if(!motivoCancelacionUsado)return msg('Indica un motivo para cancelar la reserva.',1);
  if(!['confirmada','tentativa'].includes(r.estado))
   return msg('Solo se pueden cancelar reservas en estado tentativa o confirmada. Estado actual: '+String(r.estado||'sin estado').replace('_',' '),1);
  const x=await sb.rpc('cancelar_reserva',{p_reserva_id:r.id,p_motivo:motivoCancelacionUsado});
  if(!x.error)cargoCancelacion=x.data;
  else{
   const fb=await cancelarReservaFallbackPMS(r,motivoCancelacionUsado);
   if(!fb.ok)e=fb.error;
   else{cargoCancelacion=fb.cargo;cancelacionFallback=true;}
  }
 }
 if(k==='conf'){
  if(r.estado!=='tentativa')return msg('Solo se puede confirmar una reserva en estado tentativa.',1);
  ({error:e}=await sb.from('reservas').update({estado:'confirmada'}).eq('id',r.id));
 }
 if(k==='ns'){
  const n=prompt('Nota del no-show (opcional):');if(n===null)return;
  const x=await sb.rpc('marcar_no_show',{p_reserva_id:r.id,p_nota:n});e=x.error;
  if(!e)msg('No-show registrado. Cargo aplicado: '+clp(x.data)+'. Se recomienda cobrarlo, pero no es obligatorio.')
 }
 if(k==='del')({error:e}=await sb.from('reservas').delete().eq('id',r.id));
 if(e)return msg(errTxt(e),1);
 const estadoEsperado={in:'en_casa',can:'cancelada',conf:'confirmada',ns:'no_show'}[k];
 if(estadoEsperado){
  let {data:posterior,error:pe}=await sb.from('reservas').select('id,estado').eq('id',r.id).maybeSingle();
  if(pe)return msg('La acción se envió, pero no se pudo verificar su estado en Supabase: '+errTxt(pe),1);
  if(k==='can'&&posterior?.estado!=='cancelada'){
   const fb=await cancelarReservaFallbackPMS(r,motivoCancelacionUsado);
   if(!fb.ok)return msg('La función histórica no cambió el estado y falló la cancelación compatible: '+errTxt(fb.error),1);
   cancelacionFallback=true;cargoCancelacion=fb.cargo;
   const ver=await sb.from('reservas').select('id,estado').eq('id',r.id).maybeSingle();
   if(ver.error)return msg('La cancelación se intentó, pero no se pudo verificar el estado: '+errTxt(ver.error),1);
   posterior=ver.data;
  }
  if(!posterior||posterior.estado!==estadoEsperado){
   await cargar();
   return msg('La acción no quedó guardada. Estado esperado: '+estadoEsperado+'; estado actual: '+String(posterior?.estado||'reserva no encontrada')+'.',1);
  }
 }
 if(k==='del'){
  await sincronizarReservaUI(r.id,false);
  return;
 }
 await sincronizarReservaUI(r.id,true);
 if(k==='can'){
  if(cancelacionFallback)msg('Reserva cancelada mediante la vía compatible. No se aplicó un cargo automático.'+
   (cancelacionPreSaveFallida?' Los cambios pendientes de la ficha no se pudieron guardar antes de cancelar; revisa esos campos.':' Revisa si corresponde registrar una penalización.'),cancelacionPreSaveFallida?1:0);
  else if(Number(cargoCancelacion)>0)msg('Reserva cancelada. Cargo aplicado: '+clp(cargoCancelacion)+
   (cancelacionPreSaveFallida?'. Atención: algunos cambios pendientes no se guardaron.':''),cancelacionPreSaveFallida?1:0);
  else msg('Reserva cancelada correctamente.'+
   (cancelacionPreSaveFallida?' Atención: algunos cambios pendientes no se guardaron.':''),cancelacionPreSaveFallida?1:0);
 }
}

async function guardarPagoFormulario(){

 const sum=alloc.reduce((a,x)=>a+x.monto_original,0),eps=usd?0.005:0.5;

   p_reserva_id:S.cur.id,
   p_metodo:mt,
   p_moneda:usd?'USD':'CLP',

 });

function expandirCodigosUnidad(valor){
 const entrada=String(valor??'').trim();
 if(!entrada)throw new Error('Ingresa al menos un código de unidad');
 const partes=entrada.split(',');
 if(partes.some(p=>!p.trim()))throw new Error('Hay un elemento vacío. Separa los códigos con comas, sin dejar comas al final.');
 const codigos=[];
 for(const bruto of partes){
  const parte=bruto.trim(),rango=/^(\d+)\s*-\s*(\d+)$/.exec(parte);
  if(rango){
   const desde=Number(rango[1]),hasta=Number(rango[2]);
   if(!Number.isSafeInteger(desde)||!Number.isSafeInteger(hasta))throw new Error('El rango contiene números no válidos');
   if(hasta<desde)throw new Error('El rango '+parte+' está invertido. Usa el número menor primero.');
   if(hasta-desde+1>200||codigos.length+(hasta-desde+1)>200)throw new Error('Puedes crear como máximo 200 unidades por operación');
   const ancho=Math.max(rango[1].length,rango[2].length);
   for(let n=desde;n<=hasta;n++)codigos.push(String(n).padStart(ancho,'0'));
  }else{
   codigos.push(parte);
   if(codigos.length>200)throw new Error('Puedes crear como máximo 200 unidades por operación');
  }
 }
 const vistos=new Set(),duplicados=new Set();
 for(const codigo of codigos){
  const clave=codigo.toLocaleLowerCase('es-CL');
  if(vistos.has(clave))duplicados.add(codigo);
  vistos.add(clave);
 }
 if(duplicados.size)throw new Error('Hay códigos repetidos en la lista: '+[...duplicados].join(', '));
 return codigos;
}

}

 if(!ED_ROLES_TODOS.includes(rol)){

$('#gw').addEventListener('pointerdown',e=>{
 if(e.button!==0||e.target.closest('.et'))return;
 const b=e.target.closest('.blq');if(!b)return;
 const r=S.res.find(x=>x.id===b.dataset.r);if(!r||!MOV.includes(r.estado))return;
 const rz=!!e.target.closest('.rz');
 // Una reserva en casa no puede cambiar de unidad ni mover sus fechas,
 // pero sí puede extender su salida desde el tirador derecho.
 if(r.estado==='en_casa'&&!rz)return;
 if(r.estado==='bloqueado')return;
 const g=$('#gw');
 DRG={r,b,rz,pointerId:e.pointerId,x0:e.clientX,y0:e.clientY,
  scrollLeft0:g?.scrollLeft||0,mov:false,dd:0,u:r.unidad_id,w0:b.offsetWidth};
});
window.addEventListener('pointermove',e=>{
 const d=DRG;if(!d||e.pointerId!==d.pointerId)return;
 const g=$('#gw'),scrollDelta=(g?.scrollLeft||0)-d.scrollLeft0;
 const dx=(e.clientX-d.x0)+scrollDelta,dy=e.clientY-d.y0;
 if(!d.mov){
  if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
  d.mov=true;e.preventDefault();d.b.classList.add('arr');document.body.style.cursor=d.rz?'ew-resize':'grabbing';
 }
 d.dd=Math.round(dx/W);
 if(d.r.estado==='en_casa'){
  if(!d.rz)d.dd=0;
  else if(d.dd<0)d.dd=0; // In-house: do not shorten or backdate via drag.
 }
 if(d.rz){
  const min=1-diff(d.r.fecha_entrada,d.r.fecha_salida);
  if(d.dd<min)d.dd=min;
  d.b.style.width=(d.w0+d.dd*W)+'px';
  return;
 }
 d.b.style.transform=`translate(${d.dd*W}px,${dy}px)`;
 // elementFromPoint can return a child (.blq, .small, etc.), not the row cell itself.
 // closest() resolves the containing unit row reliably.
 const hit=document.elementFromPoint(e.clientX,e.clientY);
 const cell=hit?.closest('.dias[data-u]');
 if(cell)d.u=cell.dataset.u; // Keep the last valid row while the pointer crosses gaps.
 document.querySelectorAll('.dst').forEach(x=>x.classList.remove('dst'));
 if(cell&&d.u!==d.r.unidad_id)cell.classList.add('dst');
});
window.addEventListener('pointerup',async e=>{

 DRG=null;document.body.style.cursor='';
 document.querySelectorAll('.dst').forEach(x=>x.classList.remove('dst'));
 if(!d.mov){drenarRealtime();return}

 }finally{

async function extenderReservaDesdeArrastre(r,ent,sal){
 const {data:live,error:liveError}=await sb.from('reservas')
  .select('id,unidad_id,fecha_entrada,fecha_salida,estado').eq('id',r.id).maybeSingle();
 if(liveError){msg('No se pudo verificar la reserva antes de extender: '+liveError.message,1);await cargar();return false}
 if(!live||live.unidad_id!==r.unidad_id||live.fecha_entrada!==r.fecha_entrada||live.fecha_salida!==r.fecha_salida||live.estado!==r.estado){
  msg('La reserva cambió desde que se cargó el calendario. No se aplicó la extensión; revisa los datos actualizados.',1);
  await cargar();return false;
 }
 if(ent!==r.fecha_entrada||sal<=r.fecha_salida){
  dibujar();msg('Una reserva en casa solo puede extender su fecha de salida mediante arrastre.',1);return false;
 }
 const {data:resultado,error}=await sb.rpc('buscar_extension_estadia',{
  p_reserva_id:r.id,p_nueva_entrada:ent,p_nueva_salida:sal
 });
 if(error){msg('No se pudo verificar la extensión: '+errTxt(error),1);await cargar();return false}
 if(!resultado?.posible){
  msg('No se puede extender la estadía: '+(resultado?.razon||'no existe una extensión válida'),1);
  await cargar();return false;
 }
 const plan=Array.isArray(resultado.plan)?resultado.plan:[];
 if(plan.length){
  // If the extension requires moving other reservations, expose the existing
  // review-and-confirm flow instead of silently executing a chain on drag.
  dibujar();S.cur={...r};
  await abrirExtensionEstadia();
  const ei=$('#ext_ent'),es=$('#ext_sal');
  if(!ei||!es)return false;
  ei.value=ent;es.value=sal;
  S.extensionEstadia={reservaId:r.id,nuevaEntrada:ent,nuevaSalida:sal,plan};
  extRenderPlan(plan,ent,sal);
  msg('La extensión requiere reacomodar otras reservas. Revisa el plan y confirma en la ventana.',0);
  return false;

// Asigna cada reserva a un cupo usando las fechas exactas de estacionamiento.
function estAsignar(rs,cap){
 // Colorea globalmente el grafo de conflictos para no declarar "sin cupo"
 // solo por conservar asignaciones antiguas que pueden reorganizarse.
 const items=rs.filter(r=>(r._pf||[]).length>0);
 if(!items.length)return [];
 const daySet=items.map(r=>new Set((r._pf||[]).filter(d=>d>=r.fecha_entrada&&d<r.fecha_salida)));
 const neighbors=items.map(()=>new Set());
 for(let i=0;i<items.length;i++){
  for(let j=i+1;j<items.length;j++){
   let clash=false;const A=daySet[i],B=daySet[j],small=A.size<=B.size?A:B,large=small===A?B:A;
   for(const d of small){if(large.has(d)){clash=true;break}}
   if(clash){neighbors[i].add(j);neighbors[j].add(i)}
  }
 }
 const colors=Array(items.length).fill(0);
 const validOld=items.map(r=>Number.isInteger(Number(r.cupo_estacionamiento))&&Number(r.cupo_estacionamiento)>=1&&Number(r.cupo_estacionamiento)<=cap?Number(r.cupo_estacionamiento):0);
 let nodesTried=0,bestCount=-1,bestColors=Array(items.length).fill(0);
 const maxSearch=300000;
 function chooseNode(){
  let best=-1,bestSat=-1,bestDegree=-1,bestOld=-1;
  for(let i=0;i<items.length;i++){
   if(colors[i]!==0)continue;
   const used=new Set();for(const j of neighbors[i])if(colors[j]>0)used.add(colors[j]);
   const sat=used.size,deg=neighbors[i].size,old=validOld[i]?1:0;
   if(sat>bestSat||(sat===bestSat&&deg>bestDegree)||(sat===bestSat&&deg===bestDegree&&old>bestOld)){
    best=i;bestSat=sat;bestDegree=deg;bestOld=old;
   }
  }
  return best;
 }
 function solve(done,assigned){
  if(assigned>bestCount){bestCount=assigned;bestColors=colors.map(x=>x>0?x:0)}
  if(bestCount===items.length)return true;
  if(assigned+(items.length-done)<=bestCount)return false;
  if(++nodesTried>maxSearch)return false;
  const i=chooseNode();
  if(i<0)return false;
  const blocked=new Set();for(const j of neighbors[i])if(colors[j]>0)blocked.add(colors[j]);
  const preferred=validOld[i],candidates=[];
  if(preferred)candidates.push(preferred);
  for(let color=1;color<=cap;color++)if(color!==preferred)candidates.push(color);
  for(const color of candidates){
   if(blocked.has(color))continue;
   colors[i]=color;
   if(solve(done+1,assigned+1))return true;
   colors[i]=0;
  }
  // Se permite dejar sin cupo un nodo para maximizar la cantidad que sí cabe,
  // en vez de borrar visualmente todas las asignaciones cuando hay exceso real.
  colors[i]=-1;
  const solved=solve(done+1,assigned);
  colors[i]=0;
  return solved;
 }
 if(cap>0)solve(0,0);
 items.forEach((r,i)=>{r._c=bestColors[i]||null});
 return items.filter(r=>(r._c||null)!==(r.cupo_estacionamiento||null)&&r.estado!=='check_out');
}

async function estLleno(edId,fe,fs,excl,fechasSeleccionadas=[]){
 const {data:e,error:ee}=await sb.from('edificios').select('cupos_estacionamiento').eq('id',edId).single(),cap=Number(e?.cupos_estacionamiento)||0;
 if(ee)throw ee;
 if(!cap)return {sin:true};
 const noches=[...new Set((Array.isArray(fechasSeleccionadas)?fechasSeleccionadas:[]).filter(d=>d>=fe&&d<fs))].sort();
 if(!noches.length)return null;
 let q=sb.from('reservas').select('id').eq('usa_estacionamiento',true).in('unidad_id',S.unidades.filter(u=>u.edificio_id===edId).map(u=>u.id)).in('estado',['tentativa','confirmada','en_casa']).lt('fecha_entrada',fs).gt('fecha_salida',fe);
 if(excl)q=q.neq('id',excl);
 const {data:reservas,error:re}=await q;if(re)throw re;
 const ids=(reservas||[]).map(r=>r.id);if(!ids.length)return null;
 const {data:rows,error:feError}=await sb.from('estacionamiento_reserva_fechas').select('reserva_id,fecha').in('reserva_id',ids).in('fecha',noches);
 if(feError)throw feError;
 const counts=Object.create(null);
 (rows||[]).forEach(x=>{const k=String(x.fecha).slice(0,10);counts[k]=(counts[k]||0)+1});
 const dia=noches.find(d=>(counts[d]||0)>=cap);
 return dia?{cap,dia}:null}
const avisoCupo=async(ed,fe,fs,excl)=>{const l=await estLleno(ed,fe,fs,excl);
 if(l?.sin)return confirm('Este edificio no tiene cupos de estacionamiento definidos. ¿Continuar igualmente?');
 if(l?.dia)return confirm('No quedan cupos de estacionamiento la noche del '+fm(l.dia)+' (hay '+l.cap+' en total). ¿Continuar igualmente?');
 return true};

function gmActualizarDistribucion(){const out=$('#gmPagoResumen');if(!out)return;const propuesta=gmDistribucionPropuesta(),prev=[...document.querySelectorAll('.gmPagoAsignacion')],prevExceptions=[...document.querySelectorAll('.gmPagoExcepcion')].map(x=>({reserva:x.dataset.reserva,motivo:x.querySelector('.gmPagoMotivo')?.value||'estacionamiento',monto:x.querySelector('.gmPagoExcepcionMonto')?.value||''}));out.innerHTML='<div style="border:1px solid var(--bd);border-radius:9px;padding:12px"><b>Distribución por reserva y motivo</b><p class="mu">El importe asignado a cada reserva incluye todos sus motivos. Las excepciones se descuentan de estadía; la suma de todos los conceptos debe coincidir con el pago recibido.</p>'+GM.miembros.map((m,i)=>{const prevVal=prev.find(x=>x.dataset.reserva===m.reserva_id)?.value,asignado=prevVal!==undefined?prevVal:propuesta[i].monto_clp,ex=prevExceptions.filter(x=>x.reserva===m.reserva_id);return '<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div style="display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:10px;align-items:start"><div><b>'+esc(m.reserva.huesped_nombre_copia||'Huésped')+'</b><div class="mu">Estadía y cargos: '+gmMontoFmt(m.totalEstadia)+' · Pagado: '+gmMontoFmt(m.pagado)+' · Saldo: '+gmMontoFmt(m.saldo)+'</div></div><label>Total asignado (CLP)<input class="gmPagoAsignacion" data-reserva="'+m.reserva_id+'" type="number" min="0" step="1" value="'+esc(asignado)+'" oninput="gmPagoTotales()"></label></div><div class="gmPagoExcepciones" data-reserva="'+m.reserva_id+'" style="margin:8px 0 0 8px">'+ex.map(x=>gmPagoExcepcionHtml(m.reserva_id,x.motivo,x.monto)).join('')+'</div><button type="button" style="margin-top:5px" onclick="gmAgregarMotivoGrupo(\''+m.reserva_id+'\')">＋ Excepción de motivo</button><div class="mu" style="margin-top:4px">El monto restante se registra como estadía.</div></div>'}).join('')+'<div id="gmPagoTotales" style="margin-top:10px"></div></div>';gmPagoTotales()}
function gmPagoExcepcionHtml(reservaId,motivo='estacionamiento',monto=''){return '<div class="gmPagoExcepcion" data-reserva="'+reservaId+'" style="display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;align-items:end;margin:6px 0"><label>Motivo<select class="gmPagoMotivo" onchange="gmPagoTotales()">'+[['estacionamiento','Estacionamiento'],['horario_extra','Horario extra'],['penalizacion','Penalización'],['consumos','Consumos'],['garantia','Garantía'],['otro','Otro']].map(x=>'<option value="'+x[0]+'" '+(motivo===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label>Monto (CLP)<input class="gmPagoExcepcionMonto" type="number" min="1" step="1" value="'+esc(monto)+'" oninput="gmPagoTotales()"></label><button type="button" aria-label="Quitar excepción" onclick="gmEliminarMotivoGrupo(this)">✕</button></div>'}function gmAgregarMotivoGrupo(reservaId){const box=[...document.querySelectorAll('.gmPagoExcepciones')].find(x=>x.dataset.reserva===reservaId);if(!box)return;box.insertAdjacentHTML('beforeend',gmPagoExcepcionHtml(reservaId,'estacionamiento',''));gmPagoTotales()}function gmEliminarMotivoGrupo(btn){btn.closest('.gmPagoExcepcion')?.remove();gmPagoTotales()}function gmPagoTotales(){const out=$('#gmPagoTotales');if(!out)return;const moneda=$('#gmPagoMoneda')?.value||'CLP',total=moneda==='USD'?Math.round((Number($('#gmPagoMonto')?.value)||0)*(Number($('#gmPagoCambio')?.value)||0)):Math.round(Number($('#gmPagoMonto')?.value)||0),asignaciones=[...document.querySelectorAll('.gmPagoAsignacion')],asignado=asignaciones.reduce((a,x)=>a+Math.max(0,Math.round(Number(x.value)||0)),0),delta=total-asignado,errores=[];for(const a of asignaciones){const ex=[...document.querySelectorAll('.gmPagoExcepcion')].filter(x=>x.dataset.reserva===a.dataset.reserva),suma=ex.reduce((n,x)=>n+Math.max(0,Math.round(Number(x.querySelector('.gmPagoExcepcionMonto')?.value)||0)),0);if(suma>Math.max(0,Math.round(Number(a.value)||0)))errores.push('Las excepciones superan el amiento'?'Estacionamiento':x.motivo.replace(/_/g,' '))+' '+gmMontoFmt(x.monto)).join(', ')}).filter(x=>!x.endsWith(': ')).join('\\n');if(!confirm('Confirma el pago grupal de '+gmMontoFmt(total)+'.\\n\\n'+detalle+'\\n\\n¿Registrar los pagos individuales con estos motivos?'))return;const q=await sb.rpc('registrar_pago_compartido_grupo',{p_grupo_id:id,p_metodo:$('#gmPagoMetodo').value,p_moneda:moneda,p_monto_original:monto,p_tipo_cambio:moneda==='USD'?cambio:null,p_id_transaccion:$('#gmPagoTx').value.trim()||null,p_referencia:$('#gmPagoRef').value.trim()||null,p_distribucion:distribucion});if(q.error)return msg('No se registró el pago: '+errTxt(q.error)+'. Comprueba la migración v3.1 de SQL.txt.',1);await gmAbrirGrupo(id);msg('Pago compartido registrado con sus motivos y distribución confirmados.')}

/* ===== Centro de Ayuda / FAQ PMS v3.1 ===== */
const FAQ_PMS = [
 {cat:'Primeros pasos',icon:'🧭',items:[
  ['¿Qué es el PMS y qué puedo gestionar aquí?','Es el sistema de gestión hotelera para administrar reservas, huéspedes, grupos, pagos, cargos adicionales, estacionamiento, limpieza y tareas administrativas. Las opciones visibles dependen de tu rol y de los edificios que tengas autorizados.'],
  ['¿Qué significan los colores de la planilla?','En las reservas, azul indica confirmada; verde indica huésped en casa; gris indica check-out; naranjo indica tentativa; gris oscuro identifica bloqueos y rojo puede indicar garantía pendiente. En limpieza: verde es limpia, azul es en proceso, rojo es sucia y amarillo es defectuosa. Además, una reserva de huésped que está en casa y mantiene saldo pendiente puede destacarse en amarillo: revisa el saldo en la ficha, porque ese amarillo es una advertencia de pago, no el estado de limpieza.'],
  ['¿Qué significa que una operación se esté guardando?','El PMS está intentando registrar los cambios. Espera a que termine y no pulses repetidamente el botón. Después, verifica que el cambio aparezca en la ficha; si tarda o falla, comprueba el resultado antes de volver a intentar.'],
  ['¿Debo recargar la página después de cada operación?','No debería ser necesario en el uso normal. Espera unos segundos y comprueba la vista o vuelve a abrir el registro. Si solo se actualiza después de recargar, informa el problema: puede ser una falla de sincronización visual.']
 ]},
 {cat:'Reservas y disponibilidad',icon:'🛏️',items:[
  ['¿Cómo creo una reserva individual o grupal?','Desde «＋ Reservas» elige «Nueva Reserva» para una estadía individual o «Gestionar Grupos» para crear reservas vinculadas bajo un mismo nombre. En el flujo grupal puedes ingresar datos comunes, añadir unidades y duplicar una reserva para crear otras más rápido. Revisa siempre los datos individuales antes de guardar cada una.'],
  ['¿Qué debo revisar antes de guardar una reserva?','Confirma nombre y datos del huésped, edificio y unidad, fechas y horas, tarifa, cantidad de personas, canal, estacionamiento y observaciones. Verifica que la unidad esté disponible durante toda la estadía y que el precio corresponda al acuerdo con el huésped.'],
  ['¿Puedo modificar una reserva después de crearla?','Sí, según tu rol y el estado de la reserva. Abre la ficha, cambia los campos autorizados y pulsa «Guardar Cambios». Luego vuelve a comprobar las fechas, la tarifa y los demás datos importantes.'],
  ['¿Cómo extiendo una estadía?','Abre la ficha de la reserva y utiliza «Extender estadía» cuando el huésped solicite quedarse más noches. Indica la nueva fecha de salida y revisa la disponibilidad posterior, el importe adicional y si hay otra reserva que ocupe esa unidad. Si la unidad no está disponible para todo el período, no fuerces la extensión: evalúa el botón «Cambiar unidad» o la reacomodación inteligente. Verifica que la nueva fecha haya quedado guardada.'],
  ['¿Qué significan tentativa, confirmada, en casa y check-out?','«Tentativa» es una reserva aún no confirmada; «confirmada» significa que la estadía está confirmada; «en casa» indica que se registró el check-in y el huésped está alojado; «check-out» indica que la salida fue registrada. La confirmación no significa que la reserva esté pagada por completo.'],
  ['¿Qué diferencia hay entre cancelar y marcar no-show?','Cancelar registra que la reserva no se realizará. No-show corresponde a cuando el huésped no se presenta según lo previsto y se debe registrar esa ausencia. Usa el estado que refleje lo ocurrido y agrega el motivo cuando corresponda.'],
  ['¿Puedo borrar una reserva en vez de cancelarla?','No son lo mismo. Cancelar conserva el registro de la operación y es lo habitual cuando la estadía no se realizará. La eliminación puede retirar información y debe reservarse para casos autorizados por Administración o Gerencia.'],
  ['¿Cómo cambio una reserva de unidad?','Abre la ficha y utiliza el botón «Cambiar unidad» cuando esté disponible. Revisa que la unidad de destino tenga disponibilidad para todo el período. Si no existe una unidad libre que resuelva el caso, utiliza «Reacomodación inteligente» desde la búsqueda de disponibilidad para revisar alternativas y los movimientos que propone. No confirmes un cambio sin comprobar el plan, las unidades afectadas y los permisos del edificio.'],
  ['¿Qué es la reacomodación inteligente?','Es una alternativa de disponibilidad que propone mover una o más reservas entre unidades para liberar la unidad o el período solicitado. Revisa cada movimiento sugerido, las fechas y los edificios implicados antes de aplicarlo. No significa que el cambio ya esté realizado: verifica el resultado final y deriva a Administración si el edificio está fuera de tus permisos.'],
  ['¿Puedo ejecutar check-in, check-out, cancelación o no-show para un grupo?','Sí, desde la gestión del grupo puedes seleccionar una acción grupal y aplicarla a las reservas elegibles. Algunas reservas podrían no cumplir las condiciones; revisa el resumen de resultados y comprueba individualmente las que no se procesaron.']
 ]},
 {cat:'Huéspedes y acompañantes',icon:'👥',items:[
  ['¿Qué diferencia hay entre huésped y reserva?','El huésped es la persona; la reserva representa una estadía concreta, con sus propias fechas, unidad, tarifa y estado. Una persona puede tener más de una reserva.'],
  ['¿Qué hago si dos huéspedes tienen el mismo nombre?','No asumas que son la misma persona. Comprueba documento u otros datos identificadores y busca el registro existente antes de crear uno nuevo, para evitar duplicados.'],
  ['¿Quién puede editar los datos maestros desde «Huéspedes»?','La edición directa está habilitada para Administración, Gerencia y SysAdmin. Recepción debe utilizar los campos que tenga disponibles en la reserva y puede registrar observaciones desde ella.'],
  ['¿Cómo agrego acompañantes?','En la ficha de la reserva utiliza la sección «Acompañantes», completa los datos solicitados y marca si corresponde a un menor. Comprueba que las personas queden vinculadas a la reserva correcta y que la cantidad coincida con la estadía.']
 ]},
 {cat:'Grupos y reservas múltiples',icon:'🧑‍🤝‍🧑',items:[
  ['¿Qué es un grupo de reservas?','Permite vincular varias reservas bajo un mismo nombre, por ejemplo, una familia, empresa o delegación. Cada reserva conserva sus propios datos, fechas, unidad, tarifa y estado.'],
  ['¿Cómo creo un grupo?','Entra a «＋ Reservas» → «Gestionar Grupos» y crea un grupo con el nombre que permita identificarlo fácilmente. Desde el flujo grupal puedes añadir unidades y completar los datos compartidos que correspondan.'],
  ['¿Cómo agrego una reserva existente a un grupo?','Abre la información de la reserva, pulsa «Agregar a grupo» y selecciona un grupo existente o crea uno nuevo. Después comprueba que la reserva aparezca en la gestión del grupo.'],
  ['¿Cómo creo varias reservas más rápido?','Dentro del flujo de reservas grupales, crea una reserva y utiliza la opción de duplicarla para añadir otras. Antes de guardar cada copia, revisa huésped, unidad, fechas, tarifa, ocupación y cualquier campo que deba ser distinto.'],
  ['¿Duplicar una reserva hace que todas tengan el mismo precio?','No necesariamente. Cada reserva mantiene su tarifa individual; duplicar solo acelera la creación y no sustituye la revisión de los datos de cada unidad.'],
  ['¿Todas las reservas del grupo deben tener las mismas fechas?','No. Puedes tener estadías distintas. Usa «fechas comunes» solo cuando realmente corresponda a todas las reservas y comprueba las fechas individuales antes de guardar.'],
  ['¿Todas las reservas deben pertenecer a la misma categoría?','No. Un grupo puede incluir unidades y categorías diferentes, con precios distintos. La disponibilidad debe verificarse para cada unidad y período.'],
  ['¿Qué puedo gestionar desde el grupo?','Puedes revisar las reservas vinculadas, realizar acciones grupales disponibles, administrar pagos y cargos compartidos según tus permisos y guardar observaciones o reclamos. Comprueba siempre qué reservas y movimientos quedan afectados.'],
  ['¿Cómo registro un pago para todo el grupo?','Cuando un pago cubra varias reservas del mismo grupo, debes registrarlo como «pago grupal» desde la gestión del grupo. No lo dividas artificialmente en varios pagos individuales: registra una sola operación por el importe realmente recibido y verifica su distribución y los saldos resultantes.'],
  ['¿Pueden tener tarifas diferentes y compartir un pago?','Sí. Mantén las tarifas de cada reserva como corresponden y registra el abono conjunto mediante pago grupal. Después verifica que el importe recibido y los saldos pendientes sean correctos.'],
  ['¿Qué hago si solo algunas reservas del grupo completaron el check-in?','Revisa el resultado de cada reserva. Las que no cumplan las condiciones deben permanecer en su estado correspondiente; pertenecer al grupo no significa que automáticamente estén alojadas.'],
  ['¿Puedo registrar observaciones y reclamos para el grupo?','Sí, utiliza los campos de observaciones y reclamos de la gestión grupal para información común. Para una circunstancia que afecte solo a una persona o unidad, registra también la nota en la reserva individual y verifica dónde quedó guardada.']
 ]},
 {cat:'Pagos y saldos',icon:'💳',items:[
  ['¿Cómo registro un pago?','Abre la reserva y utiliza la sección de pagos. Ingresa el importe real, la moneda y el medio de pago que corresponda. Comprueba que el movimiento se haya guardado en la reserva correcta y que el saldo se actualice.'],
  ['¿Cuál es la diferencia entre precio, pago y saldo?','El precio es lo que se cobra por el alojamiento; el pago es el dinero registrado como recibido; el saldo pendiente es lo que falta por cubrir, considerando los conceptos incluidos en el cálculo. Una reserva confirmada puede tener saldo pendiente.'],
  ['¿Puedo registrar varios pagos para una reserva?','Sí, si el huésped paga en varios abonos. Cada movimiento debe representar un pago real. No registres el mismo abono dos veces.'],
  ['¿Cuándo debo utilizar pago grupal?','Siempre que un pago corresponda a varias reservas del mismo grupo, regístralo como pago grupal. Es el procedimiento que se debe seguir de ahora en adelante para mantener correctamente la relación del pago y los saldos.'],
  ['¿Qué pasa si el pago grupal no cubre todo el importe?','Registra solo el importe realmente recibido. Comprueba el saldo pendiente del grupo y de las reservas involucradas; no registres dinero que no se haya recibido para dejar el saldo en cero.'],
  ['¿Qué hago si el pago se registró en la reserva equivocada?','Comprueba el movimiento y las dos reservas afectadas. No agregues otro pago para compensarlo. Si tienes permiso, corrige o elimina el movimiento según el procedimiento autorizado y verifica los saldos resultantes.'],

function faqEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function faqFormatAnswer(txt){
 const safe=faqEscape(txt);
 return safe.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>'<p>'+line+'</p>').join('');
}
var FAQ_PMS_STATE = { category: 'Todos', query: '' };

function abrirFAQ() {
  var host = document.getElementById('mo');
  if (!host) return;
  FAQ_PMS_STATE = { category: 'Todos', query: '' };
  host.innerHTML = '<section class="faq-shell" role="dialog" aria-modal="true" aria-label="Ayuda y soporte">' +
    '<header class="faq-head"><div><h2>❔ Ayuda y soporte</h2><p>Guía práctica del PMS: reservas, huéspedes, grupos, pagos, limpieza y solución de dudas.</p></div>' +
    '<button class="faq-close" id="faqClose" type="button" aria-label="Cerrar ayuda">✕</button></header>' +
    '<div class="faq-tools"><div class="faq-search-wrap"><span class="faq-search-icon">⌕</span>' +
    '<input id="faqSearch" type="search" placeholder="Buscar por palabra, función o problema…" autocomplete="off" aria-label="Buscar en preguntas frecuentes"></div>' +
    '<span class="faq-count" id="faqCount" aria-live="polite"></span></div>' +
    '<div class="faq-layout"><nav class="faq-index" id="faqIndex" aria-label="Índice de contenidos"></nav>' +
    '<main class="faq-content" id="faqContent" tabindex="0"></main></div>' +
    '<footer class="faq-footer"><p><b>¿Necesitas más ayuda?</b><br>Contacta al equipo de soporte e indica qué estabas haciendo y qué mensaje apareció.</p>' +
    '<a class="faq-contact" href="tel:+56945832337"><span>📞</span><span><small>CONSULTAS Y SOPORTE</small>+56 9 4583 2337</span></a></footer></section>';
  host.style.display = 'grid';
  var close = document.getElementById('faqClose');
  var search = document.getElementById('faqSearch');
  var nav = document.getElementById('faqIndex');
  if (close) close.addEventListener('click', cerrarFAQ);
  if (search) search.addEventListener('input', function () { faqRender(); });
  if (nav) nav.addEventListener('click', function (event) {
    var button = event.target.closest('button[data-category]');
    if (!button || !nav.contains(button)) return;
    faqSeleccionarCategoria(button.getAttribute('data-category'));
  });
  faqRender();
  if (search) search.focus();
}
function cerrarFAQ() {
  var host = document.getElementById('mo');
  if (host) { host.style.display = 'none'; host.innerHTML = ''; }
}
function faqSeleccionarCategoria(cat) {
  FAQ_PMS_STATE.category = String(cat || 'Todos');
  faqRender();
  var content = document.getElementById('faqContent');
  if (content) content.scrollTop = 0;
}
function faqRender() {
  var nav = document.getElementById('faqIndex');
  var content = document.getElementById('faqContent');
  var search = document.getElementById('faqSearch');
  var count = document.getElementById('faqCount');
  if (!nav || !content) return;

  var q = String(search ? search.value : FAQ_PMS_STATE.query || '').trim().toLocaleLowerCase('es');
  FAQ_PMS_STATE.query = q;
  var total = FAQ_PMS.reduce(function (n, c) { return n + c.items.length; }, 0);
  var categories = [['Todos', '☷', total]].concat(FAQ_PMS.map(function (c) {
    return [c.cat, c.icon, c.items.length];
  }));
  nav.innerHTML = '<div class="faq-index-title">Índice de contenidos</div>' + categories.map(function (item) {
    var cat = item[0], icon = item[1], n = item[2];
    return '<button type="button" data-category="' + faqEscape(cat) + '" class="' +
      (FAQ_PMS_STATE.category === cat ? 'active' : '') + '" aria-pressed="' +
      (FAQ_PMS_STATE.category === cat ? 'true' : 'false') + '">' +
      '<span class="faq-nav-num">' + n + '</span><span>' + icon + ' ' + faqEscape(cat) + '</span></button>';
  }).join('');

  var visible = FAQ_PMS.map(function (c, ci) {
    var items = c.items.map(function (it, ii) { return { q: it[0], a: it[1], ii: ii }; }).filter(function (it) {
      var matchesCategory = FAQ_PMS_STATE.category === 'Todos' || FAQ_PMS_STATE.category === c.cat;
      var haystack = (c.cat + ' ' + it.q + ' ' + it.a).toLocaleLowerCase('es');
      return matchesCategory && (!q || haystack.indexOf(q) !== -1);
    });
    return { cat: c.cat, icon: c.icon, ci: ci, items: items };
  }).filter(function (c) { return c.items.length > 0; });

  var found = visible.reduce(function (n, c) { return n + c.items.length; }, 0);
  if (count) count.textContent = found + ' de ' + total + ' preguntas';
  var welcome = '<div class="faq-welcome"><span class="faq-welcome-icon">💡</span><div>' +
    '<strong>Encuentra una respuesta rápidamente</strong><p>Selecciona una categoría en el índice o busca una palabra. Abre una pregunta para consultar la respuesta.</p></div></div>';
  var empty = '<div class="faq-empty"><div style="font-size:30px;margin-bottom:8px">🔎</div>' +
    '<b>No encontramos coincidencias</b><p>Prueba otro término o selecciona «Todos» en el índice.</p></div>';
  var sections = visible.map(function (c) {
    var questions = c.items.map(function (it) {
      return '<details class="faq-item"><summary><span class="faq-qnum">' + (it.ii + 1) +
        '</span><span>' + faqEscape(it.q) + '</span></summary><div class="faq-answer">' +
        faqFormatAnswer(it.a) + '</div></details>';
    }).join('');
    return '<section class="faq-category" id="faq-cat-' + c.ci + '"><h3><span>' + c.icon +
      '</span>' + faqEscape(c.cat) + '</h3>' + questions + '</section>';
  }).join('');
  content.innerHTML = welcome + (found ? sections : empty);
}
window.abrirFAQ = abrirFAQ;
window.cerrarFAQ = cerrarFAQ;
window.faqRender = faqRender;
window.faqSeleccionarCategoria = faqSeleccionarCategoria;

</script></body></html>
