<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f5f7;--pn:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#dfe3ea;--ac:#2563eb;--w:46px}
[data-theme=dark]{--bg:#12161c;--pn:#1b212a;--tx:#e6eaf0;--mu:#8b96a5;--bd:#2c3542}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.r{background:#dc2626;color:#fff;border-color:#dc2626}
#login{max-width:320px;margin:15vh auto;padding:24px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;display:grid;gap:10px}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd)}
header b{margin-right:auto}
#gw{overflow:auto;height:calc(100vh - 92px)}
.fila{display:flex;border-bottom:1px solid var(--bd)}
.et{position:sticky;left:0;z-index:3;flex:0 0 130px;box-sizing:border-box;background:var(--pn);padding:6px 8px;border-right:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.ed .et{background:var(--bg);font-weight:600;color:var(--mu);width:100%}
.dias{position:relative;height:44px;flex:0 0 auto;background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--w) - 1px),var(--bd) calc(var(--w) - 1px) var(--w))}
.cab{position:sticky;top:0;z-index:4;background:var(--pn)}
.cab .dias{height:48px;display:flex;background:none}
.d{flex:0 0 var(--w);text-align:center;font-size:11px;color:var(--mu);border-right:1px solid var(--bd);box-sizing:border-box}
.hoy{position:absolute;top:0;bottom:0;width:var(--w);background:rgba(37,99,235,.09)}
.blq{position:absolute;top:5px;bottom:5px;border-radius:6px;padding:2px 6px;font-size:11px;overflow:hidden;white-space:nowrap;cursor:pointer;color:#fff;box-sizing:border-box;line-height:1.25}
.blq small{display:block;opacity:.85}
.confirmada{background:#2563eb}.en_casa{background:#16a34a}.check_out{background:#6b7280}
.tentativa{background:repeating-linear-gradient(45deg,#d97706,#d97706 6px,#f59e0b 6px,#f59e0b 12px)}
.bloqueado{background:repeating-linear-gradient(45deg,#374151,#374151 6px,#4b5563 6px,#4b5563 12px)}
#dr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--pn);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.2);padding:16px;overflow:auto;z-index:10;display:none}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:11}
#mo>div{background:var(--pn);border-radius:12px;padding:20px;width:560px;max-width:95vw;max-height:92vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:grid;gap:2px;font-size:12px;color:var(--mu)}
.al{padding:8px;border-radius:6px;margin:6px 0;background:#fef3c7;color:#78350f}.al.r{background:#fee2e2;color:#7f1d1d}
.cand{padding:6px;border:1px solid var(--bd);border-radius:6px;margin:4px 0;cursor:pointer}.cand.sel{border-color:var(--ac);background:rgba(37,99,235,.1)}
#ms{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;z-index:20;display:none}
.lim{font-size:12px;font-weight:700}
h4{margin:16px 0 6px}
.mu{color:var(--mu);font-size:12px}
#tl{padding:12px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.tk{background:var(--pn);border:1px solid var(--bd);border-left:6px solid;border-radius:10px;padding:14px}
.tk h3{margin:0 0 6px;font-size:20px}
.tk .bt{display:flex;gap:8px;margin-top:10px}.tk .bt button{flex:1;padding:14px;font-size:16px}
.rw{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}.rw input,.rw select{min-width:0;flex:1}.rw input[type=checkbox],.rw button{flex:none}
.tg{display:inline-block;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#78350f;font-size:12px;font-weight:600;margin-left:6px}

:root{--w:56px}
body{line-height:1.4}
button,input,select,textarea{border-radius:8px;padding:7px 11px}
button{font-weight:500}button:hover{filter:brightness(.96)}
header{padding:12px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}header b{font-size:16px}
#bar{height:44px;display:flex;gap:8px;align-items:center;padding:0 20px;background:var(--pn);border-bottom:1px solid var(--bd)}
#gw{height:calc(100vh - 160px);user-select:none;margin:12px 20px;border:1px solid var(--bd);border-radius:12px;background:var(--pn);overflow-x:auto;overflow-y:auto;overflow-anchor:none;overscroll-behavior-x:contain;scroll-behavior:auto;scroll-snap-type:none;will-change:scroll-position;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}#gw .fila{width:max-content;min-width:100%}
.et{flex:0 0 160px;padding:6px 12px}.et b{font-size:15px}
.tp{display:block;font-size:11px;color:var(--mu);font-weight:500}
#bar .tp{display:inline;background:var(--bg);padding:2px 8px;border-radius:99px}
.ed .et{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dias{height:56px;cursor:cell}
.blq{top:6px;bottom:6px;border-radius:8px;padding:5px 9px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.blq b{display:block;overflow:hidden;text-overflow:ellipsis}.blq small{font-size:11px}
.sl{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.16);border:2px solid var(--ac);border-radius:4px;box-sizing:border-box;pointer-events:none;z-index:1}
.d b{font-size:15px;color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cat{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--pn)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.ph img{width:100%;height:60px;object-fit:cover;border-radius:8px;cursor:pointer}.ph img:first-child{grid-column:1/-1;height:150px}
.ph.vacio{height:80px;place-items:center;display:grid;background:var(--bg);border-radius:8px;color:var(--mu)}
h4{font-size:16px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
.sec{--c:var(--ac);border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.sec h4.st{margin:0 0 12px;font-size:18px;color:var(--c);border-bottom:2px solid var(--c)}
.c1{--c:#2563eb}.c2{--c:#7c3aed}.c3{--c:#16a34a}.c4{--c:#ea580c}.c5{--c:#dc2626}
#dr{width:min(1120px,96vw)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tot>div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mu)}.tot b{display:block;font-size:20px;color:var(--tx)}
.pg{padding:6px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.big{padding:9px 18px;font-size:15px}

/* ---- Huéspedes hospedados / movimientos del día ---- */
#hosp{position:fixed;inset:0;z-index:13;background:var(--bg);display:none;flex-direction:column}
.hos-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hos-h h3{margin:0 auto 0 0;font-size:18px}.hos-b{flex:1;overflow:auto;padding:16px 20px}
.hos-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.hos-tabs{display:flex;gap:6px;flex-wrap:wrap}.hos-tabs button{border-radius:99px;padding:7px 12px}
.hos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.hos-card{border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:12px;background:var(--pn);padding:13px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}.hos-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.13)}
.hos-card.house{border-left-color:#16a34a}.hos-card.in{border-left-color:#7c3aed}.hos-card.out{border-left-color:#ea580c}.hos-card.tent{border-left-color:#d97706}
.hos-top{display:flex;gap:10px;align-items:flex-start}.hos-unit{font-size:17px;font-weight:800}.hos-building{font-size:12px;color:var(--mu);margin-top:1px}.hos-name{font-size:16px;font-weight:700;margin-top:9px}.hos-dates{font-size:12px;color:var(--mu);margin-top:3px}
.hos-badges{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}.hos-badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.hos-badge.ok{background:#dcfce7;color:#166534}.hos-badge.in{background:#ede9fe;color:#5b21b6}.hos-badge.out{background:#ffedd5;color:#9a3412}.hos-badge.tent{background:#fef3c7;color:#78350f}.hos-badge.neutral{background:var(--bg);color:var(--mu)}
.hos-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.hos-meta>div{background:var(--bg);border-radius:8px;padding:7px 9px;font-size:12px}.hos-meta b{display:block;font-size:13px;color:var(--tx)}
.hos-comp{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}.hos-comp-title{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.hos-comp-list{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}.hos-comp-item{background:var(--bg);border-radius:7px;padding:4px 7px;font-size:12px}
.hos-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.hos-summary>div{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--mu);font-size:11px}.hos-summary b{display:block;color:var(--tx);font-size:21px}
@media(max-width:720px){.hos-b{padding:12px}.hos-grid{grid-template-columns:1fr}.hos-summary{grid-template-columns:repeat(2,1fr)}.hos-meta{grid-template-columns:1fr}}
/* ---- Catálogo pantalla completa ---- */
#cat{position:fixed;inset:0;z-index:12;background:var(--bg);display:none;flex-direction:column}
#cat .ch{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06)}
#cat .ch h3{margin:0 auto 0 0;align-self:center;font-size:18px}
#cat .cb{flex:1;overflow:auto;padding:16px 20px}
#cat .cg{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
#cat .ph img{height:80px}#cat .ph img:first-child{height:220px}#cat .ph .cover{grid-column:1/-1;height:220px;display:grid;place-items:center;background:var(--bg);color:var(--mu);border-radius:8px}#cat .ph .thumb{height:80px;display:grid;place-items:center;background:var(--bg);color:var(--mu);border-radius:8px}
.dis{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin:6px 0}
.dis.ok{background:#dcfce7;color:#166534}.dis.no{background:#fef3c7;color:#78350f}.dis.nd{background:var(--bg);color:var(--mu)}
#gal{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.93);display:none;flex-direction:column;color:#fff}
#gal .gt{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
#gal .gm{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#gal .gm img{max-width:92vw;max-height:100%;object-fit:contain}
#gal .fl{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;padding:12px 18px;background:rgba(255,255,255,.18);color:#fff;border:0}
#gal .th{display:flex;gap:6px;justify-content:center;padding:10px;overflow:auto}
#gal .th img{height:60px;width:90px;flex:none;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer}#gal .th img.on{opacity:1;outline:2px solid #fff}
.lc{position:absolute;top:0;bottom:0;width:var(--w);pointer-events:none;box-sizing:border-box}
.lc.limpia{background:rgba(22,163,74,.30)}.lc.en_proceso{background:rgba(37,99,235,.30)}.lc.sucia,.lc.defectuosa{background:rgba(220,38,38,.34)}
/* ---- Estacionamiento ---- */
#est{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column}
#est .ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06)}
#est .ch h3{margin:0 auto 0 0;font-size:18px}
#est .cb{flex:1;overflow:auto;padding:16px 20px}
.pkg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pk{border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--pn);cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:170px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pk:hover{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pk.oc{border-left:6px solid #2563eb;background:color-mix(in srgb,#2563eb 6%,var(--pn))}
.pk.lb{border-left:6px solid #eab308;background:rgba(234,179,8,.16)}
.pk.li{border:2px dashed #16a34a;background:rgba(22,163,74,.06);cursor:default;box-shadow:none}
.pkh{display:flex;gap:10px;align-items:center}
.pkc{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tx);color:var(--pn);display:grid;place-items:center;font-weight:800}
.pkt{font-weight:700;line-height:1.2}.pkt small{display:block;font-weight:500;color:var(--mu);font-size:11px}
.pkb{background:#eab308;color:#422006;font-weight:700;border-radius:8px;padding:5px 8px;font-size:13px}.pkb.ok{background:#dbeafe;color:#1e3a8a}
.pkg{font-size:17px;font-weight:700}
.pkv{margin-top:2px}.pkw{color:#dc2626;font-weight:600;font-size:12px}
.pkn{margin-top:auto;border-top:1px dashed var(--bd);padding-top:6px;font-size:12px}
.pkl{color:#16a34a;font-weight:700;font-size:16px;margin:auto 0}
.ns{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.nd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px}
.nd.on{border-color:var(--ac);outline:2px solid var(--ac)}
.nd .bar{width:100%;height:44px;background:var(--bg);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.nd .bar i{display:block;width:100%}
/* ---- Garantía / arrastre / cancelaciones ---- */
.blq.gar{background:#dc2626!important}
.rz{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;border-radius:0 8px 8px 0;touch-action:none}
.rz:hover{background:rgba(255,255,255,.4)}
.blq.arr{opacity:.88;z-index:6;pointer-events:none;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.dias.dst{background-color:rgba(37,99,235,.14)}
.gar-box{border:2px solid;border-radius:12px;padding:14px;margin:0 0 16px}
.gar-box .gt{font-weight:700;font-size:13px;letter-spacing:.04em}
.gar-box .gm{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0}
.gar-box .mu{color:inherit;opacity:.85}
.gar-box.no{border-color:#dc2626;background:rgba(220,38,38,.10);color:#b91c1c}
.gar-box.ok{border-color:#16a34a;background:rgba(22,163,74,.10);color:#15803d}
.gar-box.om{border-color:#d97706;background:rgba(217,119,6,.10);color:#b45309}
[data-theme=dark] .gar-box.no{color:#fca5a5}[data-theme=dark] .gar-box.ok{color:#86efac}[data-theme=dark] .gar-box.om{color:#fcd34d}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kp>div{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--mu)}.kp b{display:block;font-size:24px;color:var(--tx)}
.cc{border:1px solid var(--bd);border-left:6px solid;border-radius:12px;padding:12px 14px;background:var(--pn);cursor:pointer}
.cc.ca{border-left-color:#d97706}.cc.cn{border-left-color:#dc2626}.cc:hover{box-shadow:0 2px 10px rgba(0,0,0,.14)}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bd.ca{background:#fef3c7;color:#78350f}.bd.cn{background:#fee2e2;color:#7f1d1d}.bd.ok{background:#dcfce7;color:#166534}.bd.pe{background:#fee2e2;color:#7f1d1d}.bd.sc{background:var(--bg);color:var(--mu)}
.cgr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* ---- Administración de fotos del catálogo ---- */
.photo-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:12px 0 16px}
.photo-card{border:1px solid var(--bd);border-radius:12px;background:var(--pn);padding:12px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.photo-card img{width:150px;height:112px;object-fit:cover;border-radius:9px;background:var(--bg);display:block}
.photo-card .pc-body{min-width:0;display:grid;gap:9px}
.photo-card .pc-name{font-size:12px;word-break:break-all;color:var(--mu);line-height:1.3}
.photo-card .pc-actions{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.photo-card .pc-actions select{width:100%;box-sizing:border-box}
.photo-card .pc-del{background:#dc2626;color:#fff;border-color:#dc2626}
.photo-slot{font-size:12px;font-weight:700;color:var(--tx);padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.photo-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.photo-toolbar button{min-width:150px}
.photo-help{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:14px}
@media(max-width:720px){.photo-card{grid-template-columns:1fr}.photo-card img{width:100%;height:180px}}
.pago-motivo-row{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
/* ---- Menús principales ---- */
.main-menu{position:relative;display:inline-flex}
.main-menu>button{display:flex;align-items:center;gap:6px}
.menu-drop{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;display:none;z-index:30}
.menu-drop.open{display:grid}
.menu-drop button{width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:7px}
.menu-drop button:hover{background:var(--bg);filter:none}
.menu-drop .menu-sep{height:1px;background:var(--bd);margin:5px 2px}
.rec-box{border:2px solid #7c3aed;border-radius:12px;padding:14px;background:rgba(124,58,237,.06)}
.rec-box h4{margin:0 0 8px;color:#7c3aed;border-bottom:2px solid #7c3aed}
.rec-text{width:100%;min-height:180px;box-sizing:border-box;resize:vertical}
.rec-card{border:1px solid var(--bd);border-left:6px solid #7c3aed;border-radius:12px;background:var(--pn);padding:13px 14px;margin-bottom:10px}
.rec-card .rh{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.rec-card .rc{white-space:pre-wrap;margin-top:10px;padding:10px;border-radius:8px;background:var(--bg)}
.rec-meta{font-size:12px;color:var(--mu)}
.rec-empty{padding:24px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:10px}
/* ---- Auditoría ---- */
#aud{position:fixed;inset:0;z-index:13;background:var(--bg);display:none;flex-direction:column}
.au-h{padding:12px 20px 8px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06);max-height:62vh;overflow:auto}
.au-b{flex:1;overflow:auto;padding:14px 20px}
.au-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.au-chs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}

let RT={channel:null,timer:null,working:false,pending:false,pendingTable:'',mutating:0};

function solicitarRealtime(tabla=''){
 RT.pendingTable=tabla||RT.pendingTable||'';
 clearTimeout(RT.timer);
 RT.timer=setTimeout(()=>{
  if(RT.mutating||RT.working){RT.pending=true;return}
  const t=RT.pendingTable;RT.pendingTable='';
  actualizarRealtime(t).catch(e=>msg(e?.message||'Error actualizando Realtime',1));
 },350);
}

function drenarRealtime(){
 if(RT.mutating||RT.working||!RT.pending)return;
 RT.pending=false;
 const t=RT.pendingTable||'';RT.pendingTable='';
 clearTimeout(RT.timer);
 RT.timer=setTimeout(()=>actualizarRealtime(t).catch(e=>msg(e?.message||'Error actualizando Realtime',1)),0);
}

function iniciarRealtime(){
 if(RT.channel)sb.removeChannel(RT.channel);
 const refrescarRT=payload=>solicitarRealtime(payload?.table||'');
 RT.channel=sb.channel('pms-realtime')
  .on('postgres_changes',{event:'*',schema:'public'},refrescarRT)
  .subscribe(status=>{
   if(status==='CHANNEL_ERROR')msg('Realtime no pudo conectarse. Revisa la publicación supabase_realtime.',1);
  });
}

async function actualizarRealtime(tabla){
 if(RT.mutating||RT.working){RT.pending=true;RT.pendingTable=tabla||RT.pendingTable||'';return}
 RT.working=true;
 try{
  if(['perfiles','perfiles_edificios','perfiles_permisos_edicion','edificios'].includes(tabla)){
   const pe=await cargarPermisosEdificios();
   if(!pe)return;

  if($('#cat').style.display==='flex')await catDibujar();

  if($('#dr').style.display==='block'&&$('#mo').style.display!=='grid'&&S.cur?.id)await abrirDr(S.cur.id);
 }finally{
  RT.working=false;
  drenarRealtime();
 }
}

function protegerMutacionesRealtime(){
 const nombres=[
  'guardarNueva','guardarEditorReserva','marcarPagadaHistorica','guardarPermisosEdicion','accion',
  'guardarReclamo','hacerCheckOut','guardarR','guardarG','notaNueva','addAc','delAc','addCargo','addPago',
  'cambiarLimp','marcarSucia','gd','nw','guardarRanking','gCfg','guardarPermisos','borrarU',
  'addGarantia','omitirGarantia','reactivarGarantia','moverReserva','gAplicar','gQuitarFecha','gDet',
  'guardarRankingFotos','subirFotos','delFoto','borrarReserva','bDelR','bDelH','bDelTodos'
 ];
 for(const nombre of nombres){
  const fn=window[nombre];
  if(typeof fn!=='function'||fn.__pmsRtWrapped)continue;
  const env=function(...args){
   RT.mutating++;
   let out;
   try{out=fn.apply(this,args)}
   catch(e){RT.mutating--;drenarRealtime();throw e}
   if(out&&typeof out.then==='function')return out.finally(()=>{RT.mutating--;drenarRealtime()});
   RT.mutating--;drenarRealtime();return out;
  };
  env.__pmsRtWrapped=true;
  window[nombre]=env;
 }
}

async function obtenerUidReservaReal(r){
  // Fuente principal: la fila exacta de reservas.
  const {data:rr,error}=await sb.from('reservas').select('uid_reserva').eq('id',r.id).maybeSingle();
  if(!error&&rr?.uid_reserva) return rr.uid_reserva;
  // Respaldo: el buscador ya devuelve el UID de reserva correcto asociado
  // al mismo reserva_id; sirve para corregir una copia antigua en memoria.
  if(r.huesped_nombre_copia){
    const {data:bs}=await sb.rpc('buscar_reservas',{p_texto:r.huesped_nombre_copia});
    const hit=(bs||[]).find(x=>x.reserva_id===r.id&&x.uid_reserva);
    if(hit?.uid_reserva)return hit.uid_reserva;
  }
  return r.uid_reserva||'—';
}

async function marcarPagadaHistorica(){
 const r=S.cur;if(!r)return;
 const {data:s,error:es}=await sb.from('saldo_reserva').select('total_a_pagar,total_pagado').eq('reserva_id',r.id).maybeSingle();
 if(es)return msg(es.message,1);
 const pendiente=Math.max(0,(+s?.total_a_pagar||0)-(+s?.total_pagado||0));
 if(pendiente<=0)return msg('La reserva ya tiene $0 pendiente');
 if(!confirm('Se registrará una regularización histórica por '+clp(pendiente)+' para dejar esta reserva en $0 pendiente. No representa un nuevo cobro; sirve para migrar una reserva cuyo pago ya estaba realizado. ¿Continuar?'))return;

}

async function abrirReclamoReserva(reservaId=S.cur?.id){
  if(!reservaId)return;
  let r=S.cur;
  if(!r||r.id!==reservaId){
    const {data:rr,error:er}=await sb.from('reservas').select('*').eq('id',reservaId).maybeSingle();
    if(er||!rr)return msg(er?.message||'No se encontró la reserva',1);
    r=rr;S.cur=r;
  }
  const {data,error}=await sb.from('reclamos_sugerencias').select('*').eq('reserva_id',reservaId).maybeSingle();
  if(error)return msg('No se pudo cargar el reclamo: '+error.message,1);

  $('#mo').style.display='grid';$('#recTxt').focus();
}
async function guardarReclamo(reservaId=S.cur?.id){

  const {error}=await sb.from('reclamos_sugerencias').delete().eq('reserva_id',reservaId);
  if(error)return msg('No se pudo eliminar el reclamo: '+error.message,1);
  cerrar();msg('Reclamo eliminado');if(S.cur?.id===reservaId)abrirDr(reservaId);return;

async function moverReserva(r,uid,ent,sal){
 if(r.estado==='en_casa'){msg('Una reserva en casa nunca puede ser movida de unidad',1);return}
 if(r.estado==='bloqueado'){msg('Los bloqueos no se pueden mover mediante movimiento automático',1);return}
 if(r.no_mover_unidad&&!confirm('⚠ Esta reserva está marcada como “No mover de esta unidad”.\\n\\nEl movimiento manual que estás realizando puede moverla igualmente.\\n\\n¿Confirmas que deseas moverla?')){dibujar();return}
 if(uid===r.unidad_id)return;
 let tar=null;const uo=S.unidades.find(x=>x.id===r.unidad_id),un=S.unidades.find(x=>x.id===uid);
 const bo=uo?.tipos_unidad?.tarifa_base||0,bn=un?.tipos_unidad?.tarifa_base||0;
 if(bo!==bn){const v=await preguntarTarifa(r.tarifa_noche,bn);if(v===null){dibujar();return}tar=v===r.tarifa_noche?null:v}
 const {data:oldPark}=await sb.from('estacionamiento_reserva_fechas').select('fecha').eq('reserva_id',r.id).order('fecha');
 const {error}=await sb.rpc('mover_reserva',{p_reserva_id:r.id,p_unidad_id:uid,p_entrada:ent,p_salida:sal,p_tarifa:tar});
 if(error){msg(errTxt(error),1);dibujar();return}
 if(r.usa_estacionamiento){const oldDates=fechasParkingReserva(r,oldPark||[]),shift=diff(r.fecha_entrada,ent),newDates=oldDates.map(d=>addD(d,shift)).filter(d=>d>=ent&&d<sal);const pe=await guardarFechasParking(r.id,newDates);if(pe)return msg('La reserva se movió, pero no se pudieron actualizar sus fechas de estacionamiento: '+pe.message,1);await sb.from('reservas').update({noches_estacionamiento:newDates.length}).eq('id',r.id)}
 msg('Reserva actualizada: '+(un?un.edificios.nombre+' · '+un.codigo)+' · '+fm(ent)+' → '+fm(sal));

  if(fase==='antes'){main=out||(llega?null:cur)||null;next=llega?cur:null}
  else if(fase==='despues'){main=cur||null}
  else{main=out||cur||null;next=out&&cur?cur:null}
  if(!main){cards+=`<div class="pk li"><div class="pkh"><span class="pkc">${c}</span><span class="pkt">Libre</span></div><div class="pkl">${fase==='antes'&&next?'Libre hasta las 13:00':'Cupo libre'}</div>${nx(next)}</div>`;continue}
  ocu++;const esOut=main===out;if(esOut)lib++;const un=nU(main.unidad_id);let ban='';
  if(esOut)ban=`<div class="pkb">⏰ ${D===hoy?'Se libera hoy a las 13:00':D<hoy?'Se liberó el '+fm(D):'Se libera el '+fm(D)+' a las 13:00'}</div>`;
  else if(main.fecha_entrada===D)ban=`<div class="pkb ok">${fase==='despues'?'Ingresó desde las 13:00':D<hoy?'Llegó el '+fm(D):'Llega '+(D===hoy?'hoy':'el '+fm(D))+' a las 13:00'}</div>`;
  cards+=`<div class="pk ${esOut?'lb':'oc'}" onclick="abrirDr('${main.id}')"><div class="pkh"><span class="pkc">${c}</span><span class="pkt">${esc(un.t)}<small>${esc(un.c)}</small></span></div>${ban}<div class="pkg">${esc(main.huesped_nombre_copia||'')}</div><div class="mu">Check-out: <b>${fm(main.fecha_salida)}</b>${main.estado==='tentativa'?' · tentativa':''}</div>${veh(main)}${nx(next)}</div>`}
 const sin=rsE.filter(r=>r._c==null);
 const tabs=E.eds.map(x=>`<button class="${x.id===E.ed?'p':''}" onclick="E.ed='${x.id}';estDibujar()">${esc(x.nombre)} · ${noche(x.id,D)}/${x.cupos_estacionamiento}</button>`).join('');
 let st='';for(let i=0;i<21;i++){const d=addD(E.s,i),n=noche(ed.id,d),p=Math.min(100,Math.round(n/cap*100)),col=n>cap?'#7f1d1d':n===cap?'#dc2626':n/cap>=.7?'#f59e0b':'#16a34a';
  st+=`<button class="nd ${d===D?'on':''}" onclick="E.f='${d}';estCargar()" title="${n} de ${cap} cupos ocupados la noche del ${fm(d)}"><span class="mu">${new Date(d+'T00:00:00Z').toLocaleDateString('es',{weekday:'short',timeZone:'UTC'})}</span><b>${fm(d)}${d===hoy?' •':''}</b><div class="bar"><i style="height:${p}%;background:${col}"></i></div><span>${n}/${cap}</span></button>`}
 $('#esf').value=D;
 $('#esb').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${tabs}</div>
 <div class="kp" style="grid-template-columns:repeat(4,1fr)"><div>Cupos totales<b>${cap}</b></div><div>Ocupados ${D===hoy?'ahora':'el '+fm(D)}<b>${ocu}</b></div><div>Se liberan a las 13:00<b style="color:#ca8a04">${lib}</b></div><div>Libres<b style="color:#16a34a">${cap-ocu}</b></div></div>
 ${sin.length?`<div class="al r">⚠ ${sin.length} reserva${sin.length>1?'s':''} con estacionamiento sin cupo disponible: ${sin.map(r=>`<a href="#" onclick="abrirDr('${r.id}');return false">${esc(r.huesped_nombre_copia)} (${fm(r.fecha_entrada)}→${fm(r.fecha_salida)})</a>`).join(' · ')}</div>`:''}
 <div class="pkg2">${cards}</div>
 <h4>Noches ocupadas · ${esc(ed.nombre)}</h4><p class="mu" style="margin-top:0">Cada noche cuenta del día de entrada hasta el día anterior a la salida; el día del check-out no se cobra. Toca un día para verlo arriba.</p><div class="ns">${st}</div>`;
}
async function estLleno(edId,fe,fs,excl){
 const {data:e}=await sb.from('edificios').select('cupos_estacionamiento').eq('id',edId).single(),cap=e?.cupos_estacionamiento||0;
 if(!cap)return {sin:true};
 let q=sb.from('reservas').select('fecha_entrada,fecha_salida,noches_estacionamiento,noches').eq('usa_estacionamiento',true).in('unidad_id',S.unidades.filter(u=>u.edificio_id===edId).map(u=>u.id)).in('estado',['tentativa','confirmada','en_casa']).lt('fecha_entrada',fs).gt('fecha_salida',fe);
 if(excl)q=q.neq('id',excl);const {data}=await q;
 for(let d=fe;d<fs;d=addD(d,1))if((data||[]).filter(r=>r.fecha_entrada<=d&&d<addD(r.fecha_entrada,Math.max(0,Math.min(r.noches_estacionamiento??r.noches??0,diff(r.fecha_entrada,r.fecha_salida))))).length>=cap)return {cap,dia:d};
 return null}
const avisoCupo=async(ed,fe,fs,excl)=>{const l=await estLleno(ed,fe,fs,excl);
 if(l?.sin)return confirm('Este edificio no tiene cupos de estacionamiento definidos. ¿Continuar igualmente?');
 if(l?.dia)return confirm('No quedan cupos de estacionamiento la noche del '+fm(l.dia)+' (hay '+l.cap+' en total). ¿Continuar igualmente?');
 return true};

let BQ={ids:[]},bt3;
async function pBor(){
 $('#pc').innerHTML=`<div class="al r">⚠ Zona de borrado: elimina para siempre huéspedes y reservas con sus pagos, cargos, acompañantes y notas. Úsalo para limpiar datos de prueba.</div><input id="bbq" style="width:100%;box-sizing:border-box" placeholder="Buscar por nombre, documento o UID (mín. 2 letras)" oninput="bBuscar()"><div id="bbr"></div>`}

async function bRun(){
 const q=$('#bbq')?.value.trim()||'';if(q.length<2){BQ.ids=[];if($('#bbr'))$('#bbr').innerHTML='';return}
 const t=q.replace(/[,()%]/g,' '),qd=q.replace(/[^0-9A-Za-z]/g,'').toUpperCase();let f='nombre_completo.ilike.%'+t+'%,uid_huesped.ilike.%'+t+'%';if(qd.length>=4)f+=',documento_normalizado.ilike.%'+qd+'%';
 const {data:hs,error}=await sb.from('huespedes').select('id,uid_huesped,nombre_completo,numero_documento').or(f).order('nombre_completo').limit(30);if(error)return msg(error.message,1);
 BQ.ids=(hs||[]).map(x=>x.id);
 const {data:rs}=BQ.ids.length?await sb.from('reservas').select('id,uid_reserva,huesped_id,unidad_id,fecha_entrada,fecha_salida,estado').in('huesped_id',BQ.ids).order('fecha_entrada',{ascending:false}):{data:[]};
 $('#bbr').innerHTML=BQ.ids.length?`<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span class="mu">${BQ.ids.length} huésped(es)</span><button class="r" onclick="bDelTodos()">🗑 Borrar los ${BQ.ids.length} resultados</button></div>`+hs.map(h=>{const L=(rs||[]).filter(x=>x.huesped_id===h.id);
  return `<div class="sec c5"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${esc(h.nombre_completo)}</b> <span class="mu">${esc(h.uid_huesped)}${h.numero_documento?' · '+esc(h.numero_documento):''}</span></div><button class="r" onclick="bDelH('${h.id}',${L.length})">🗑 Huésped</button></div>${L.map(x=>`<div class="rw"><span style="flex:1">${esc(x.uid_reserva)} · ${esc(nomU(x.unidad_id))} · ${fm(x.fecha_entrada)} → ${fm(x.fecha_salida)} · ${x.estado.replace('_',' ')}</span><button onclick="bDelR('${x.id}')">🗑</button></div>`).join('')||'<p class="mu" style="margin:6px 0 0">Sin reservas</p>'}</div>`}).join(''):'<p class="mu">Sin resultados</p>'}
async function bDelR(id){if(!confirm('¿Borrar esta reserva por completo? No se puede deshacer.'))return;

async function bDelTodos(){const ids=[...BQ.ids];
 if(prompt(`Vas a borrar ${ids.length} huésped(es) con todas sus reservas. Escribe BORRAR para confirmar:`)!=='BORRAR')return;
