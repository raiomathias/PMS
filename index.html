<style>

/* ---- Estacionamiento ---- */

#est .ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06)}

.pkg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

[data-theme=dark] .gar-box.no{color:#fca5a5}[data-theme=dark] .gar-box.ok{color:#86efac}[data-theme=dark] .gar-box.om{color:#fcd34d}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}

.cgr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
</style></head><body>
<div id="login"><h2>PMS</h2><input id="lu" placeholder="Nombre Apellido"><input id="lp" type="password" placeholder="Clave" onkeydown="if(event.key==='Enter')entrar()"><button class="p" onclick="entrar()">Entrar</button></div>
<div id="app" style="display:none">
<header><b id="hu">PMS</b><button onclick="mover(-15)">◀</button><button onclick="mover(0)">Hoy</button><button onclick="mover(15)">▶</button><input type="date" id="hf" onchange="S.ini=this.value;cargar()"><button class="p big" onclick="abrirNueva()">＋ Nueva reserva</button><button class="big" onclick="abrirBuscar()">🔍 Buscar</button><button onclick="abrirCatalogo()">🏨 Catálogo</button><button onclick="abrirEst()">🅿 Estacionamiento</button><button id="bcn" style="display:none" onclick="abrirCanc()">🚫 Cancelaciones</button><button id="bad" style="display:none" onclick="abrirAdmin()">⚙ Administración</button><button onclick="tema()">🌓</button><button onclick="salir()">Salir</button></header>
<div class="mu" style="padding:6px 16px"><span style="color:#2563eb">■</span> Confirmada · <span style="color:#16a34a">■</span> En casa · <span style="color:#6b7280">■</span> Check-out · <span style="color:#f59e0b">■</span> Tentativa · <span style="color:#4b5563">■</span> Bloqueo · <span style="color:#dc2626">■</span> Garantía pendiente &nbsp;|&nbsp; Limpieza (ayer y hoy): <span style="color:#16a34a">■</span> limpia · <span style="color:#2563eb">■</span> en proceso · <span style="color:#dc2626">■</span> sucia o defectuosa</div>
<div id="bar"></div><div id="gw"></div></div>
<div id="dr"></div><div id="mo"></div><div id="cat"></div><div id="est"></div><div id="gal"></div><div id="ms"></div>
<script>
// ====== CONFIGURACIÓN: pega aquí tus datos (Supabase → Project Settings → API) ======
const SB_URL='https://pnakzbuncxsgxmbtjwuf.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuYWt6YnVuY3hzZ3htYnRqd3VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzA3MTgsImV4cCI6MjEwNjMwNjcxOH0.ppQrMVI79xNEhHC1-llQ7hzq4JOwPHEJisEnRJ1nFZU';
// ====================================================================================
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),W=56,ND=30;
const S={perfil:null,unidades:[],res:[],lim:{},cfg:{},ini:null,cur:null,g:null,gar:{}};
const MOV=['tentativa','confirmada','en_casa','bloqueado'];let DRG=null,DRGsup=false,PT=null;
const LIM={sucia:['🧹','S','#d97706','Sucia'],en_proceso:['🔄','P','#2563eb','En proceso'],limpia:['✅','L','#16a34a','Limpia'],defectuosa:['⚠️','D','#dc2626','Defectuosa']};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const hoyStr=()=>new Date().toLocaleDateString('sv',{timeZone:'America/Santiago'});
const fm=s=>s.slice(8)+'/'+s.slice(5,7), hh=k=>parseInt(String(k).slice(0,2));
const errTxt=e=>e.code==='23P01'?'La unidad ya está ocupada en esas fechas':e.message;
const er=(e,ok)=>e?msg(errTxt(e),1):msg(ok);
const F=(id,l,v='',t='text')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const SEL=(id,l,o,v)=>`<label>${l}<select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></label>`;
function msg(t,err){const m=$('#ms');m.textContent=t;m.style.background=err?'#b91c1c':'#111';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',4500)}
function tema(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.t=t}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}

// ---------- Sesión ----------
const emailDe=n=>n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'.')+'@pms.local';
async function entrar(){const {error}=await sb.auth.signInWithPassword({email:emailDe($('#lu').value),password:$('#lp').value});if(error)return msg('Usuario o clave incorrectos',1);iniciar()}
async function salir(){await sb.auth.signOut();location.reload()}
async function iniciar(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('#login').style.display='grid';$('#app').style.display='none';return}
 const {data:p}=await sb.from('perfiles').select('nombre_completo,rol,activo').eq('id',session.user.id).maybeSingle();
 if(!p||!p.activo){await sb.auth.signOut();$('#login').style.display='grid';return msg('Usuario sin perfil activo',1)}
 S.perfil=p;S.ini=addD(hoyStr(),-2);
 $('#login').style.display='none';$('#app').style.display='block';
 $('#hu').textContent='PMS · '+p.nombre_completo+' ('+p.rol+')';
 $('#bad').style.display=$('#bcn').style.display=['administracion','gerencia','sysadmin'].includes(p.rol)?'':'none';
 if(p.rol==='limpieza')return vistaLimpieza();
 const {data:c}=await sb.from('configuracion').select('clave,valor');S.cfg=Object.fromEntries((c||[]).map(x=>[x.clave,x.valor]));
 await cargar();
 let t;const d=()=>{clearTimeout(t);t=setTimeout(()=>{cargar();if($('#est').style.display==='flex')estCargar()},400)};
 sb.channel('pms').on('postgres_changes',{event:'*',schema:'public',table:'reservas'},d).on('postgres_changes',{event:'*',schema:'public',table:'limpieza'},d).subscribe();
}

// ---------- Planificador ----------
function mover(n){S.ini=n===0?addD(hoyStr(),-2):addD(S.ini,n);cargar()}
async function cargar(){
 const fin=addD(S.ini,ND);$('#hf').value=S.ini;
 const [u,r,l,gp,lh]=await Promise.all([
  sb.from('unidades').select('id,codigo,orden,edificio_id,tipo_unidad_id,edificios(nombre,orden,requiere_documento),tipos_unidad(nombre,tarifa_base)').eq('activo',true),
  sb.from('reservas').select('*,huespedes(uid_huesped)').lt('fecha_entrada',fin).gt('fecha_salida',S.ini).not('estado','in','(cancelada,no_show)'),
  sb.from('estado_limpieza_actual').select('*'),
  sb.from('garantia_reserva').select('reserva_id,monto,pagado').eq('requiere',true).eq('omitida',false).in('estado',['tentativa','confirmada','en_casa']).lt('fecha_entrada',fin).gt('fecha_salida',S.ini),
  sb.rpc('limpieza_grilla',{p_desde:addD(hoyStr(),-2)})]);

async function accion(k){
 const r=S.cur;let e;
 if(k==='in')({error:e}=await sb.rpc('hacer_check_in',{p_reserva_id:r.id}));
 if(k==='out')return abrirCheckOut();
 if(k==='can'){const m=prompt('Motivo de la cancelación:');if(!m)return;const x=await sb.rpc('cancelar_reserva',{p_reserva_id:r.id,p_motivo:m});e=x.error;if(!e&&x.data)msg('Cancelada. Cargo aplicado: '+clp(x.data))}
 if(k==='conf')({error:e}=await sb.from('reservas').update({estado:'confirmada'}).eq('id',r.id));
 if(k==='ns'){const n=prompt('Nota del no-show (opcional):');if(n===null)return;const x=await sb.rpc('marcar_no_show',{p_reserva_id:r.id,p_nota:n});e=x.error;if(!e)msg('No-show registrado. Cargo aplicado: '+clp(x.data)+'. Se recomienda cobrarlo, pero no es obligatorio.')}
 if(k==='del')({error:e}=await sb.from('reservas').delete().eq('id',r.id));
 if(e)return msg(errTxt(e),1);refrescar();
}

async function tareasLimp(){
 const {data,error}=await sb.rpc('tablero_limpieza',{p_edificio:LB.e||null});if(error)return msg(error.message,1);
 // 0 = por limpiar (ya liberada) · 1 = aún ocupada · 2 = limpia
 const g=t=>t.reserva_estado==='en_casa'?1:t.estado==='limpia'?2:0;
 const L=(data||[]).slice().sort((a,b)=>g(a)-g(b)||(b.hay_ingreso-a.hay_ingreso)||String(a.hora_llegada||'99').localeCompare(String(b.hora_llegada||'99'))||a.edificio.localeCompare(b.edificio)||a.unidad_codigo.localeCompare(b.unidad_codigo,'es',{numeric:true}));
 const n0=L.filter(t=>g(t)===0).length,n1=L.filter(t=>g(t)===1).length,n2=L.length-n0-n1;
 $('#lr').textContent=L.length?`Por limpiar: ${n0} · Aún ocupadas: ${n1} · Limpias: ${n2}`:'';
 $('#tl').innerHTML=L.length?L.map(t=>{
  const oc=t.reserva_estado==='en_casa',lim=t.estado==='limpia',Lm=LIM[t.estado],id=t.limpieza_id;
  const col=oc?'#9ca3af':lim?'#16a34a':t.estado==='sucia'?'#eab308':t.estado==='en_proceso'?'#2563eb':'#dc2626';
  const bg=oc?'rgba(156,163,175,.10)':lim?'rgba(22,163,74,.10)':t.estado==='sucia'?'rgba(234,179,8,.14)':t.estado==='en_proceso'?'rgba(37,99,235,.08)':'rgba(220,38,38,.10)';
  const etq=oc?'Sin iniciar':Lm[0]+' '+Lm[3];
  const fch=t.fecha_salida?fm(t.fecha_salida)+' · hoy':'Pendiente desde '+fm(new Date(t.pendiente_desde).toLocaleDateString('sv',{timeZone:'America/Santiago'}));
  const ing=t.hay_ingreso?(t.hora_llegada?hm(t.hora_llegada):'Sin hora'):'Nadie hoy';
  const bt=oc||!id?[]:{sucia:[['en_proceso','Iniciar','p']],defectuosa:[['en_proceso','Iniciar de nuevo','p']],en_proceso:[['limpia','Terminar','p'],['defectuosa','Hay un problema','r']]}[t.estado]||[];
  const K=(l,v,x='')=>`<div class="mu">${l}<br><b style="color:var(--tx);font-size:15px;${x}">${v}</b></div>`;
  return `<div class="tk" style="border-left-color:${col};background:${bg}${oc?';border-style:dashed':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3 style="margin:0">${esc(t.unidad_codigo)} <span class="mu" style="font-size:13px;font-weight:500">${esc(t.categoria)}</span></h3><span class="bd" style="background:${col};color:${t.estado==='sucia'&&!oc?'#422006':'#fff'};white-space:nowrap">${etq}</span></div>
  <div class="mu">${esc(t.edificio)}</div>
  <div class="g2" style="margin-top:10px">${K('Check-out',fch)}${K('Salida aprox.',hm(t.hora_salida_aprox)||'—')}${K('Ingresan hoy',ing,t.hay_ingreso?'color:#dc2626':'')}${K('Ocupación',t.fecha_salida?(oc?'Aún ocupada':'Check-out hecho'):'Desocupada')}</div>
  ${t.observacion_recepcion?`<p style="margin:10px 0 0">📝 Recepción: ${esc(t.observacion_recepcion)}</p>`:''}${t.observacion_limpieza?`<p class="mu" style="margin:6px 0 0">Tu observación: ${esc(t.observacion_limpieza)}</p>`:''}
  <div class="bt">${bt.map(b=>`<button class="${b[2]}" onclick="cambiarLimp('${id}','${b[0]}')">${b[1]}</button>`).join('')}</div></div>`}).join(''):'<p class="mu" style="padding:20px;text-align:center">No hay unidades con check-out hoy ni pendientes de limpieza.</p>';
}

async function pGar(){
 const hoy=hoyStr(),{data,error}=await sb.from('garantia_fechas').select('unidad_id,fecha').gte('fecha',hoy).order('fecha').limit(5000);
 if(error){$('#pc').innerHTML=`<p class="mu">${esc(error.message)}. ¿Ya corriste el script SQL de garantías?</p>`;return}
 const porF={};(data||[]).forEach(x=>(porF[x.fecha]=porF[x.fecha]||[]).push(x.unidad_id));
 let ed=null,h='';const cb='display:flex;flex-direction:row;gap:6px;align-items:center';
 for(const u of S.unidades){if(u.edificio_id!==ed){ed=u.edificio_id;h+=`<div style="grid-column:1/-1;margin-top:6px"><label style="${cb}"><input type="checkbox" data-ed="${u.edificio_id}" onchange="gSelEd(this)"> <b>${esc(u.edificios.nombre)}</b> · todas</label></div>`}
  h+=`<label style="${cb};padding:4px 8px;border:1px solid var(--bd);border-radius:8px"><input type="checkbox" class="gu" data-ed="${u.edificio_id}" value="${u.id}"> ${esc(u.codigo)}</label>`}
 const chips=ids=>{const por={};ids.forEach(id=>{const u=S.unidades.find(x=>x.id===id);if(u)(por[u.edificio_id]=por[u.edificio_id]||[]).push(u)});
  return Object.values(por).map(l=>{const tot=S.unidades.filter(x=>x.edificio_id===l[0].edificio_id).length;return l.length===tot?`<span class="tg">Todo ${esc(l[0].edificios.nombre)}</span>`:l.map(u=>`<span class="tg">${esc(u.edificios.nombre)} ${esc(u.codigo)}</span>`).join('')}).join('')};
 const fl=Object.keys(porF).sort();
 $('#pc').innerHTML=`<h4 style="margin-top:0">Exigir garantía en fechas y unidades</h4>
 <p class="mu">Si alguna noche de una reserva cae en una fecha marcada para su unidad, la reserva pide garantía: el valor de su primera noche, que se descuenta del total y no se devuelve. Es solo un aviso (la reserva se puede hacer igual) y la reserva se ve en rojo en la grilla.</p>
 <div class="g2"><label>Desde<input type="date" id="gf1" value="${hoy}"></label><label>Hasta (inclusive)<input type="date" id="gf2" value="${hoy}"></label></div>
 <label style="${cb};margin:10px 0 4px"><input type="checkbox" onchange="gSelAll(this)"> <b>Seleccionar todas las unidades</b></label>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px">${h}</div>
 <div style="display:flex;gap:8px;margin-top:12px"><button class="p" onclick="gAplicar(1)">Exigir garantía</button><button onclick="gAplicar(0)">Quitar garantía</button></div>
 <h4>Fechas con garantía (próximas)</h4>${fl.map(f=>`<div class="rw"><b style="flex:0 0 140px">${new Date(f+'T00:00:00Z').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}</b><span style="flex:1;line-height:2">${chips(porF[f])}</span><button onclick="gQuitarFecha('${f}')">Quitar fecha</button></div>`).join('')||'<p class="mu">No hay fechas marcadas.</p>'}`}
function gSelAll(el){document.querySelectorAll('#pc input[type=checkbox]').forEach(x=>{if(x!==el)x.checked=el.checked})}
function gSelEd(el){document.querySelectorAll(`.gu[data-ed="${el.dataset.ed}"]`).forEach(x=>x.checked=el.checked)}
async function gAplicar(on){
 const f1=$('#gf1').value,f2=$('#gf2').value,us=[...document.querySelectorAll('.gu:checked')].map(x=>x.value);
 if(!f1||!f2||f2<f1)return msg('Revisa el rango de fechas',1);if(!us.length)return msg('Elige al menos una unidad',1);
 const n=diff(f1,f2)+1;if(n>366)return msg('Máximo 366 días por vez',1);
 if(!confirm(`${on?'Exigir':'Quitar'} garantía en ${us.length} unidad(es) × ${n} día(s)?`))return;
 if(on){const rows=[];for(let i=0;i<n;i++)for(const u of us)rows.push({unidad_id:u,fecha:addD(f1,i)});
  for(let i=0;i<rows.length;i+=500){const {error}=await sb.from('garantia_fechas').upsert(rows.slice(i,i+500),{onConflict:'unidad_id,fecha',ignoreDuplicates:true});if(error)return msg(error.message,1)}}
 else{const {error}=await sb.from('garantia_fechas').delete().in('unidad_id',us).gte('fecha',f1).lte('fecha',f2);if(error)return msg(error.message,1)}
 msg(on?'Garantía exigida':'Garantía quitada');pGar()}
async function gQuitarFecha(f){if(!confirm('¿Quitar la garantía de esta fecha en todas las unidades?'))return;
 const {error}=await sb.from('garantia_fechas').delete().eq('fecha',f);er(error,'Fecha quitada');if(!error)pGar()}

// Asigna cada reserva a un cupo (respeta el cupo guardado si no choca). Entrar y salir el mismo día comparten cupo.
function estAsignar(rs,cap){
 const so=(a,b)=>a.fecha_entrada<b.fecha_salida&&b.fecha_entrada<a.fecha_salida,por=Array.from({length:cap+1},()=>[]);
 const ord=(a,b)=>a.fecha_entrada.localeCompare(b.fecha_entrada)||a.id.localeCompare(b.id),val=r=>r.cupo_estacionamiento>=1&&r.cupo_estacionamiento<=cap;
 const poner=(r,c)=>{por[c].push(r);r._c=c},resto=rs.filter(r=>!val(r));
 rs.filter(val).sort(ord).forEach(r=>{const c=r.cupo_estacionamiento;por[c].some(x=>so(x,r))?resto.push(r):poner(r,c)});
 resto.sort(ord).forEach(r=>{let c=1;while(c<=cap&&por[c].some(x=>so(x,r)))c++;if(c<=cap)poner(r,c);else r._c=null});
 return rs.filter(r=>(r._c||null)!==(r.cupo_estacionamiento||null)&&r.estado!=='check_out');
}
async function estCargar(){

 if(error){$('#esb').innerHTML=`<p class="mu">${esc(error.message)}. ¿Ya corriste el SQL de estacionamiento?</p>`;return}
 const edDe=Object.fromEntries(S.unidades.map(u=>[u.id,u.edificio_id])),pend=[];
 data.forEach(r=>r._e=edDe[r.unidad_id]);
 E.eds.forEach(ed=>pend.push(...estAsignar(data.filter(r=>r._e===ed.id),ed.cupos_estacionamiento)));
 E.rs=data;estDibujar();
 if(pend.length)await Promise.all(pend.map(r=>sb.from('reservas').update({cupo_estacionamiento:r._c}).eq('id',r.id)));
}

 const sin=rsE.filter(r=>r._c==null);
 const tabs=E.eds.map(x=>`<button class="${x.id===E.ed?'p':''}" onclick="E.ed='${x.id}';estDibujar()">${esc(x.nombre)} · ${noche(x.id,D)}/${x.cupos_estacionamiento}</button>`).join('');
 let st='';for(let i=0;i<21;i++){const d=addD(E.s,i),n=noche(ed.id,d),p=Math.min(100,Math.round(n/cap*100)),col=n>cap?'#7f1d1d':n===cap?'#dc2626':n/cap>=.7?'#f59e0b':'#16a34a';

 $('#esf').value=D;

 <div class="kp" style="grid-template-columns:repeat(4,1fr)"><div>Cupos totales<b>${cap}</b></div><div>Ocupados ${D===hoy?'ahora':'el '+fm(D)}<b>${ocu}</b></div><div>Se liberan a las 13:00<b style="color:#ca8a04">${lib}</b></div><div>Libres<b style="color:#16a34a">${cap-ocu}</b></div></div>
 ${sin.length?`<div class="al r">⚠ ${sin.length} reserva${sin.length>1?'s':''} con estacionamiento sin cupo disponible: ${sin.map(r=>`<a href="#" onclick="abrirDr('${r.id}');return false">${esc(r.huesped_nombre_copia)} (${fm(r.fecha_entrada)}→${fm(r.fecha_salida)})</a>`).join(' · ')}</div>`:''}

 <h4>Noches ocupadas · ${esc(ed.nombre)}</h4><p class="mu" style="margin-top:0">Cada noche cuenta del día de entrada hasta el día anterior a la salida; el día del check-out no se cobra. Toca un día para verlo arriba.</p><div class="ns">${st}</div>`;
}
async function estLleno(edId,fe,fs,excl){
 const {data:e}=await sb.from('edificios').select('cupos_estacionamiento').eq('id',edId).single(),cap=e?.cupos_estacionamiento||0;
 if(!cap)return {sin:true};
 let q=sb.from('reservas').select('fecha_entrada,fecha_salida').eq('usa_estacionamiento',true).in('unidad_id',S.unidades.filter(u=>u.edificio_id===edId).map(u=>u.id)).in('estado',['tentativa','confirmada','en_casa']).lt('fecha_entrada',fs).gt('fecha_salida',fe);
 if(excl)q=q.neq('id',excl);const {data}=await q;
 for(let d=fe;d<fs;d=addD(d,1))if((data||[]).filter(r=>r.fecha_entrada<=d&&d<r.fecha_salida).length>=cap)return {cap,dia:d};
 return null}
const avisoCupo=async(ed,fe,fs,excl)=>{const l=await estLleno(ed,fe,fs,excl);
 if(l?.sin)return confirm('Este edificio no tiene cupos de estacionamiento definidos. ¿Continuar igualmente?');
 if(l?.dia)return confirm('No quedan cupos de estacionamiento la noche del '+fm(l.dia)+' (hay '+l.cap+' en total). ¿Continuar igualmente?');
 return true};

 const {data,error}=await sb.rpc('buscar_reservas',{p_texto:q});if(error)return msg(error.message,1);
 $('#br').innerHTML=(data||[]).map(x=>`<div class="cand" onclick="irReserva('${x.reserva_id}')"><b>${esc(x.huesped)}</b> <span class="mu">${esc(x.uid_huesped)} · ${esc(x.uid_reserva)}</span><br><span class="mu">${esc(x.edificio)} ${esc(x.unidad)} · ${x.fecha_entrada} → ${x.fecha_salida} · ${x.estado.replace('_',' ')}${x.telefono?' · '+esc(x.telefono):''}</span></div>`).join('')||'<p class="mu">Sin resultados</p>'},300)}
function irReserva(id){cerrar();abrirDr(id)}
