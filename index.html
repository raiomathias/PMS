<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#f4f5f7;--pn:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#dfe3ea;--ac:#2563eb;--w:46px}
[data-theme=dark]{--bg:#12161c;--pn:#1b212a;--tx:#e6eaf0;--mu:#8b96a5;--bd:#2c3542}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.r{background:#dc2626;color:#fff;border-color:#dc2626}
#login{max-width:320px;margin:15vh auto;padding:24px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;display:grid;gap:10px}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd)}
header b{margin-right:auto}
#gw{overflow:auto;height:calc(100vh - 92px)}
.fila{display:flex;border-bottom:1px solid var(--bd)}
.et{position:sticky;left:0;z-index:3;flex:0 0 130px;box-sizing:border-box;background:var(--pn);padding:6px 8px;border-right:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.ed .et{background:var(--bg);font-weight:600;color:var(--mu);width:100%}
.dias{position:relative;height:44px;flex:0 0 auto;background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--w) - 1px),var(--bd) calc(var(--w) - 1px) var(--w))}
.cab{position:sticky;top:0;z-index:4;background:var(--pn)}
.cab .dias{height:48px;display:flex;background:none}
.d{flex:0 0 var(--w);text-align:center;font-size:11px;color:var(--mu);border-right:1px solid var(--bd);box-sizing:border-box}
.hoy{position:absolute;top:0;bottom:0;width:var(--w);background:rgba(37,99,235,.09)}
.blq{position:absolute;top:5px;bottom:5px;border-radius:6px;padding:2px 6px;font-size:11px;overflow:hidden;white-space:nowrap;cursor:pointer;color:#fff;box-sizing:border-box;line-height:1.25}
.blq small{display:block;opacity:.85}
.confirmada{background:#2563eb}.en_casa{background:#16a34a}.check_out{background:#6b7280}
.tentativa{background:repeating-linear-gradient(45deg,#d97706,#d97706 6px,#f59e0b 6px,#f59e0b 12px)}
.bloqueado{background:repeating-linear-gradient(45deg,#374151,#374151 6px,#4b5563 6px,#4b5563 12px)}
#dr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--pn);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.2);padding:16px;overflow:auto;z-index:10;display:none}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:11}
#mo>div{background:var(--pn);border-radius:12px;padding:20px;width:560px;max-width:95vw;max-height:92vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:grid;gap:2px;font-size:12px;color:var(--mu)}
.al{padding:8px;border-radius:6px;margin:6px 0;background:#fef3c7;color:#78350f}.al.r{background:#fee2e2;color:#7f1d1d}
.cand{padding:6px;border:1px solid var(--bd);border-radius:6px;margin:4px 0;cursor:pointer}.cand.sel{border-color:var(--ac);background:rgba(37,99,235,.1)}
#ms{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;z-index:20;display:none}
.lim{font-size:12px;font-weight:700}
h4{margin:16px 0 6px}
.mu{color:var(--mu);font-size:12px}
#tl{padding:12px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.tk{background:var(--pn);border:1px solid var(--bd);border-left:6px solid;border-radius:10px;padding:14px}
.tk h3{margin:0 0 6px;font-size:20px}
.tk .bt{display:flex;gap:8px;margin-top:10px}.tk .bt button{flex:1;padding:14px;font-size:16px}
.rw{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}.rw input,.rw select{min-width:0;flex:1}.rw input[type=checkbox],.rw button{flex:none}
.tg{display:inline-block;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#78350f;font-size:12px;font-weight:600;margin-left:6px}

:root{--w:56px}
body{line-height:1.4}
button,input,select,textarea{border-radius:8px;padding:7px 11px}
button{font-weight:500}button:hover{filter:brightness(.96)}
header{padding:12px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}header b{font-size:16px}
#bar{height:44px;display:flex;gap:8px;align-items:center;padding:0 20px;background:var(--pn);border-bottom:1px solid var(--bd)}
#gw{height:calc(100vh - 160px);user-select:none;margin:12px 20px;border:1px solid var(--bd);border-radius:12px;background:var(--pn)}
.et{flex:0 0 160px;padding:6px 12px}.et b{font-size:15px}
.tp{display:block;font-size:11px;color:var(--mu);font-weight:500}
#bar .tp{display:inline;background:var(--bg);padding:2px 8px;border-radius:99px}
.ed .et{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dias{height:56px;cursor:cell}
.blq{top:6px;bottom:6px;border-radius:8px;padding:5px 9px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.blq b{display:block;overflow:hidden;text-overflow:ellipsis}.blq small{font-size:11px}
.sl{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.16);border:2px solid var(--ac);border-radius:4px;box-sizing:border-box;pointer-events:none;z-index:1}
.d b{font-size:15px;color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cat{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--pn)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.ph img{width:100%;height:60px;object-fit:cover;border-radius:8px;cursor:pointer}.ph img:first-child{grid-column:1/-1;height:150px}
.ph.vacio{height:80px;place-items:center;display:grid;background:var(--bg);border-radius:8px;color:var(--mu)}
h4{font-size:16px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
.sec{--c:var(--ac);border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.sec h4.st{margin:0 0 12px;font-size:18px;color:var(--c);border-bottom:2px solid var(--c)}
.c1{--c:#2563eb}.c2{--c:#7c3aed}.c3{--c:#16a34a}.c4{--c:#ea580c}.c5{--c:#dc2626}
#dr{width:min(1120px,96vw)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tot>div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mu)}.tot b{display:block;font-size:20px;color:var(--tx)}
.pg{padding:6px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.big{padding:9px 18px;font-size:15px}

/* ---- Catálogo pantalla completa ---- */
#cat{position:fixed;inset:0;z-index:12;background:var(--bg);display:none;flex-direction:column}
#cat .ch{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.06)}
#cat .ch h3{margin:0 auto 0 0;align-self:center;font-size:18px}
#cat .cb{flex:1;overflow:auto;padding:16px 20px}
#cat .cg{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
#cat .ph img{height:80px}#cat .ph img:first-child{height:220px}
.dis{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin:6px 0}
.dis.ok{background:#dcfce7;color:#166534}.dis.no{background:#fef3c7;color:#78350f}.dis.nd{background:var(--bg);color:var(--mu)}
#gal{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.93);display:none;flex-direction:column;color:#fff}
#gal .gt{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
#gal .gm{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#gal .gm img{max-width:92vw;max-height:100%;object-fit:contain}
#gal .fl{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;padding:12px 18px;background:rgba(255,255,255,.18);color:#fff;border:0}
#gal .th{display:flex;gap:6px;justify-content:center;padding:10px;overflow:auto}
#gal .th img{height:60px;width:90px;flex:none;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer}#gal .th img.on{opacity:1;outline:2px solid #fff}
</style></head><body>
<div id="login"><h2>PMS</h2><input id="lu" placeholder="Nombre Apellido"><input id="lp" type="password" placeholder="Clave" onkeydown="if(event.key==='Enter')entrar()"><button class="p" onclick="entrar()">Entrar</button></div>
<div id="app" style="display:none">
<header><b id="hu">PMS</b><button onclick="mover(-15)">◀</button><button onclick="mover(0)">Hoy</button><button onclick="mover(15)">▶</button><input type="date" id="hf" onchange="S.ini=this.value;cargar()"><button class="p big" onclick="abrirNueva()">＋ Nueva reserva</button><button class="big" onclick="abrirBuscar()">🔍 Buscar</button><button onclick="abrirCatalogo()">🏨 Catálogo</button><button id="bad" style="display:none" onclick="abrirAdmin()">⚙ Administración</button><button onclick="tema()">🌓</button><button onclick="salir()">Salir</button></header>
<div class="mu" style="padding:6px 16px"><span style="color:#2563eb">■</span> Confirmada · <span style="color:#16a34a">■</span> En casa · <span style="color:#6b7280">■</span> Check-out · <span style="color:#f59e0b">■</span> Tentativa · <span style="color:#4b5563">■</span> Bloqueo &nbsp;|&nbsp; Limpieza: 🧹S sucia · 🔄P en proceso · ✅L limpia · ⚠️D defectuosa</div>
<div id="bar"></div><div id="gw"></div></div>
<div id="dr"></div><div id="mo"></div><div id="cat"></div><div id="gal"></div><div id="ms"></div>
<script>
// ====== CONFIGURACIÓN: pega aquí tus datos (Supabase → Project Settings → API) ======
const SB_URL='https://pnakzbuncxsgxmbtjwuf.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuYWt6YnVuY3hzZ3htYnRqd3VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzA3MTgsImV4cCI6MjEwNjMwNjcxOH0.ppQrMVI79xNEhHC1-llQ7hzq4JOwPHEJisEnRJ1nFZU';
// ====================================================================================
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s),W=56,ND=30;
const S={perfil:null,unidades:[],res:[],lim:{},cfg:{},ini:null,cur:null,g:null};
const LIM={sucia:['🧹','S','#d97706','Sucia'],en_proceso:['🔄','P','#2563eb','En proceso'],limpia:['✅','L','#16a34a','Limpia'],defectuosa:['⚠️','D','#dc2626','Defectuosa']};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const hoyStr=()=>new Date().toLocaleDateString('sv',{timeZone:'America/Santiago'});
const fm=s=>s.slice(8)+'/'+s.slice(5,7), hh=k=>parseInt(String(k).slice(0,2));
const errTxt=e=>e.code==='23P01'?'La unidad ya está ocupada en esas fechas':e.message;
const er=(e,ok)=>e?msg(errTxt(e),1):msg(ok);
const F=(id,l,v='',t='text')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const SEL=(id,l,o,v)=>`<label>${l}<select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></label>`;
function msg(t,err){const m=$('#ms');m.textContent=t;m.style.background=err?'#b91c1c':'#111';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',4500)}
function tema(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.t=t}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}

// ---------- Sesión ----------
const emailDe=n=>n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'.')+'@pms.local';
async function entrar(){const {error}=await sb.auth.signInWithPassword({email:emailDe($('#lu').value),password:$('#lp').value});if(error)return msg('Usuario o clave incorrectos',1);iniciar()}
async function salir(){await sb.auth.signOut();location.reload()}
async function iniciar(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('#login').style.display='grid';$('#app').style.display='none';return}
 const {data:p}=await sb.from('perfiles').select('nombre_completo,rol,activo').eq('id',session.user.id).maybeSingle();
 if(!p||!p.activo){await sb.auth.signOut();$('#login').style.display='grid';return msg('Usuario sin perfil activo',1)}
 S.perfil=p;S.ini=addD(hoyStr(),-2);
 $('#login').style.display='none';$('#app').style.display='block';
 $('#hu').textContent='PMS · '+p.nombre_completo+' ('+p.rol+')';
 $('#bad').style.display=['administracion','gerencia','sysadmin'].includes(p.rol)?'':'none';
 if(p.rol==='limpieza')return vistaLimpieza();
 const {data:c}=await sb.from('configuracion').select('clave,valor');S.cfg=Object.fromEntries((c||[]).map(x=>[x.clave,x.valor]));
 await cargar();
 let t;const d=()=>{clearTimeout(t);t=setTimeout(cargar,400)};
 sb.channel('pms').on('postgres_changes',{event:'*',schema:'public',table:'reservas'},d).on('postgres_changes',{event:'*',schema:'public',table:'limpieza'},d).subscribe();
}

// ---------- Planificador ----------
function mover(n){S.ini=n===0?addD(hoyStr(),-2):addD(S.ini,n);cargar()}
async function cargar(){
 const fin=addD(S.ini,ND);$('#hf').value=S.ini;
 const [u,r,l]=await Promise.all([
  sb.from('unidades').select('id,codigo,orden,edificio_id,tipo_unidad_id,edificios(nombre,orden,requiere_documento),tipos_unidad(nombre,tarifa_base)').eq('activo',true),
  sb.from('reservas').select('*,huespedes(uid_huesped)').lt('fecha_entrada',fin).gt('fecha_salida',S.ini).not('estado','in','(cancelada,no_show)'),
  sb.from('estado_limpieza_actual').select('*')]);
 if(u.error||r.error)return msg((u.error||r.error).message,1);
 S.unidades=u.data.sort((a,b)=>(a.edificios.orden-b.edificios.orden)||(a.orden-b.orden)||a.codigo.localeCompare(b.codigo,'es',{numeric:true}));
 S.tipos={};S.unidades.forEach(u=>S.tipos[u.tipo_unidad_id||'']=u.tipos_unidad||{nombre:'Sin categoría',tarifa_base:0});S.res=r.data;S.lim=Object.fromEntries((l.data||[]).map(x=>[x.unidad_id,x]));dibujar();
}
function dibujar(){
 const hoy=hoyStr(),hi=diff(S.ini,hoy);let h='<div class="fila cab"><div class="et"></div><div class="dias" style="width:'+ND*W+'px">';
 for(let i=0;i<ND;i++){const d=addD(S.ini,i),t=new Date(d+'T00:00:00Z'),n=t.getUTCDate();
  h+=`<div class="d" ${d===hoy?'style="background:rgba(37,99,235,.18)"':''}>${'DLMMJVS'[t.getUTCDay()]}<br><b>${n}</b>${n===1?'<br>'+t.toLocaleDateString('es',{month:'short',timeZone:'UTC'}):''}</div>`}
 h+='</div></div>';let ed=null;
 for(const u of S.unidades){
  if(u.edificio_id!==ed){ed=u.edificio_id;h+=`<div class="fila ed"><div class="et">${esc(u.edificios.nombre)}</div></div>`}
  const l=S.lim[u.id],li=l&&LIM[l.estado];let b=hi>=0&&hi<ND?`<div class="hoy" style="left:${hi*W}px"></div>`:'';
  for(const r of S.res.filter(x=>x.unidad_id===u.id)){
   const a=diff(S.ini,r.fecha_entrada),z=diff(S.ini,r.fecha_salida),left=Math.max(a,0)*W,right=Math.min(z,ND)*W;
   const txt=r.estado==='bloqueado'?'🔒 '+esc(r.observaciones||'Bloqueo'):`<b>${esc(r.huesped_nombre_copia)}</b><small>${r.noches} noche${r.noches>1?'s':''} · ${esc(r.canal)}${r.estado_pago==='pagado'?' · pagado':''}</small>`;
   b+=`<div class="blq ${r.estado}" data-r="${r.id}" style="left:${left}px;width:${right-left-2}px" title="${esc(r.huesped_nombre_copia||'')} · ${r.estado} · ${r.fecha_entrada} → ${r.fecha_salida}">${txt}</div>`}
  h+=`<div class="fila"><div class="et" data-u="${u.id}" style="cursor:pointer" title="Limpieza"><div><b>${esc(u.codigo)}</b><span class="tp">${esc(u.tipos_unidad?.nombre||'')}</span></div>${li?`<span class="lim" style="color:${li[2]}" title="${li[3]}">${li[0]}${li[1]}</span>`:''}</div><div class="dias" data-u="${u.id}" style="width:${ND*W}px">${b}${selHtml(u.id)}</div></div>`}
 $('#gw').innerHTML=h;barra();
}
$('#gw').onclick=e=>{const et=e.target.closest('.et[data-u]');if(et)return abrirLimp(et.dataset.u);const b=e.target.closest('.blq');if(b)return abrirDr(b.dataset.r);
 const d=e.target.closest('.dias[data-u]');if(d){const f=addD(S.ini,Math.floor((e.clientX-d.getBoundingClientRect().left)/W)),q=S.sel;S.sel=e.shiftKey&&q&&q.u===d.dataset.u?{u:q.u,a:q.a,b:f}:{u:d.dataset.u,a:f,b:f};dibujar()}};
$('#gw').addEventListener('wheel',e=>{if(!e.shiftKey)return;e.preventDefault();$('#gw').scrollLeft+=e.deltaY||e.deltaX},{passive:false});
$('#mo').onclick=e=>{if(e.target.id==='mo')cerrar()};
const cerrar=()=>{$('#mo').style.display='none';if(A.open){A.open=false;cargar()}},cerrarDr=()=>{$('#dr').style.display='none'};

// ---------- Nueva reserva / bloqueo ----------
let N={h:null,c:[],lista:false};
function abrirNueva(p={}){
 N={h:null,c:[],lista:false};const ent=p.entrada||hoyStr(),tk=Object.entries(S.tipos),ed=[...new Map(S.unidades.map(u=>[u.edificio_id,u.edificios.nombre]))];
 const pu=S.unidades.find(u=>u.id===p.unidad),pt=p.tipo!==undefined?p.tipo:pu?(pu.tipo_unidad_id||''):tk[0]?.[0],pe=p.edificio||(pu?pu.edificio_id:'');
 $('#mo').innerHTML=`<div><h3>Nuevo <select id="nt" onchange="$('#nr').style.display=this.value==='r'?'block':'none';$('#nb').style.display=this.value==='b'?'block':'none'"><option value="r">Reserva</option><option value="b">Bloqueo</option></select></h3>
 <div class="sec c3"><h4 class="st">🏠 Unidad y fechas</h4><div class="g2"><label>Categoría<select id="nca" onchange="filU()">${tk.map(([id,t])=>`<option value="${id}" ${id===pt?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select></label><label>Edificio<select id="ned" onchange="filU()"><option value="">Cualquiera</option>${ed.map(([id,n])=>`<option value="${id}" ${pe===id?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
 <label>Unidad (opcional)<select id="nu" onchange="tarU()"></select></label>${SEL('nc','Canal',['directo','booking','expedia','airbnb','otro'],'directo')}${F('ne','Entrada',ent,'date')}${F('ns','Salida',p.salida||addD(ent,1),'date')}</div></div>
 <div id="nb" class="sec c5" style="display:none"><h4 class="st">🔒 Bloqueo</h4>${F('nm','Motivo del bloqueo')}</div>
 <div id="nr"><div class="sec c1"><h4 class="st">👤 Huésped</h4><input id="nq" style="width:100%;box-sizing:border-box" placeholder="Buscar por nombre o documento" oninput="buscarH()"><div id="nl"></div><div id="na"></div>

 let o=null;
 if(estado==='defectuosa'){o=prompt('¿Qué problema encontraste?');if(!o||!o.trim())return}
 if(estado==='limpia'){o=prompt('Observación (déjala vacía si no hay):');if(o===null)return}

 if(error)return msg(error.message,1);tareasLimp();
}
// ---------- Limpieza: recepción (clic en el código de unidad) ----------

async function marcarLimpia(id){const {error}=await sb.rpc('actualizar_limpieza',{p_limpieza_id:id,p_estado:'limpia',p_observacion:null});if(error)return msg(error.message,1);cerrar();cargar()}
// ---------- Panel de administración ----------
const GER=['gerencia','sysadmin'],ROLES=['recepcion','administracion','gerencia','sysadmin','limpieza'];
let A={t:'unidades',open:false};
const V=i=>i.type==='checkbox'?i.checked:i.type==='number'?(i.value===''?null:+i.value):(i.value||null);
const datos=el=>{const o={};el.querySelectorAll('[data-c]').forEach(i=>o[i.dataset.c]=V(i));return o};
const dup=e=>e&&(e.code==='23505'?{message:'Ya existe un registro con ese nombre o código'}:e);
const NI=(c,v,ph='',t='text')=>`<input data-c="${c}" type="${t}" value="${esc(v)}" placeholder="${ph}" title="${ph}">`;
const CK=(c,v,l)=>`<label style="flex-direction:row;display:flex;gap:4px;align-items:center;flex:none"><input data-c="${c}" type="checkbox" ${v?'checked':''}>${l}</label>`;
const SO=(c,o,v,vacio)=>`<select data-c="${c}">${vacio?'<option value="">—</option>':''}${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
async function gd(t,id,b){const {error}=await sb.from(t).update(datos(b.closest('.rw'))).eq('id',id);er(dup(error),'Guardado')}
async function nw(t,b,req){const o=datos(b.closest('.rw'));if(req.split(',').some(k=>o[k]===null||o[k]===''))return msg('Faltan datos',1);const {error}=await sb.from(t).insert(o);if(error)return msg(dup(error).message,1);msg('Creado');panel()}
function abrirAdmin(){A.open=true;panel('unidades')}
async function panel(t){
 if(t)A.t=t;const T=[['unidades','Unidades'],['tipos','Categorías y tarifas'],['edificios','Edificios y estacionamiento'],['config','Horarios, cargos y cancelación']];
 if(GER.includes(S.perfil.rol))T.push(['usuarios','Usuarios']);
 $('#mo').innerHTML=`<div style="width:940px"><div style="display:flex;justify-content:space-between"><h3 style="margin:0 0 10px">⚙ Administración</h3><button onclick="cerrar()">✕</button></div><div class="tabs">${T.map(x=>`<button class="${x[0]===A.t?'p':''}" onclick="panel('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="pc">Cargando…</div></div>`;
 $('#mo').style.display='grid';await ({unidades:pUni,tipos:pTip,edificios:pEdi,config:pCfg,usuarios:pUsu}[A.t])();
}
async function pUni(){
 const [u,e,t]=await Promise.all([sb.from('unidades').select('*,edificios(nombre,orden)'),sb.from('edificios').select('id,nombre').eq('activo',true).order('orden'),sb.from('tipos_unidad').select('id,nombre').order('nombre')]);
 const E=(e.data||[]).map(x=>[x.id,x.nombre]),T=(t.data||[]).map(x=>[x.id,x.nombre]);
 const L=(u.data||[]).sort((a,b)=>(a.edificios.orden-b.edificios.orden)||a.codigo.localeCompare(b.codigo,'es',{numeric:true}));
 $('#pc').innerHTML=`<h4 style="margin-top:0">Nueva unidad</h4><div class="rw">${SO('edificio_id',E,'')}${NI('codigo','','Código (ej. 101)')}${SO('tipo_unidad_id',T,'',1)}${NI('piso','','Piso')}<button class="p" onclick="nw('unidades',this,'edificio_id,codigo')">Crear</button></div>
 <h4>Unidades (${L.length})</h4>${L.map(x=>`<div class="rw"><span style="flex:0 0 90px">${esc(x.edificios.nombre)}</span>${NI('codigo',x.codigo,'Código')}${SO('tipo_unidad_id',T,x.tipo_unidad_id,1)}${NI('piso',x.piso,'Piso')}${CK('activo',x.activo,'Activa')}<button onclick="gd('unidades','${x.id}',this)">Guardar</button></div>`).join('')}<p class="mu">Una unidad desactivada deja de aparecer en la grilla. Crea primero las categorías de Raíces en la pestaña Categorías.</p>`;
}
async function pTip(){
 const {data}=await sb.from('tipos_unidad').select('*').order('nombre');
 const f=x=>`${NI('nombre',x.nombre,'Categoría (ej. Completo)')}${NI('max_adultos',x.max_adultos,'Máx. adultos','number')}${NI('max_menores',x.max_menores,'Máx. menores','number')}${NI('tarifa_base',x.tarifa_base,'Tarifa por noche (CLP)','number')}`;
 $('#pc').innerHTML=`<p class="mu" style="margin-top:0">Categoría · máx. adultos · máx. menores · tarifa por noche. Los cambios de tarifa valen para reservas nuevas; las existentes conservan la suya.</p><h4>Nueva categoría</h4><div class="rw">${f({nombre:'',max_adultos:2,max_menores:0,tarifa_base:0})}<button class="p" onclick="nw('tipos_unidad',this,'nombre')">Crear</button></div><h4>Categorías</h4>${(data||[]).map(x=>`<div class="rw">${f(x)}<button onclick="gd('tipos_unidad','${x.id}',this)">Guardar</button><button onclick="pDet('${x.id}')">📷 Detalle</button></div>`).join('')}`;
}
async function pEdi(){
 const {data}=await sb.from('edificios').select('*').order('orden');
 $('#pc').innerHTML=`<p class="mu" style="margin-top:0">Nombre · dirección · cupos de estacionamiento · orden en la grilla.</p><h4>Nuevo edificio</h4><div class="rw">${NI('nombre','','Nombre')}${NI('orden',(data||[]).length+1,'Orden','number')}<button class="p" onclick="nw('edificios',this,'nombre')">Crear</button></div><h4>Edificios</h4>${(data||[]).map(x=>`<div class="rw">${NI('nombre',x.nombre,'Nombre')}${NI('direccion',x.direccion,'Dirección')}${NI('cupos_estacionamiento',x.cupos_estacionamiento,'Cupos de estacionamiento','number')}${NI('orden',x.orden,'Orden','number')}${CK('acceso_remoto',x.acceso_remoto,'Remoto')}${CK('requiere_documento',x.requiere_documento,'Pide doc.')}${CK('activo',x.activo,'Activo')}<button onclick="gd('edificios','${x.id}',this)">Guardar</button></div>`).join('')}`;
}
async function pCfg(){
 const {data}=await sb.from('configuracion').select('*').order('clave');
 $('#pc').innerHTML=(data||[]).map(x=>`<div class="rw"><span style="flex:1 1 60%">${esc(x.descripcion||x.clave)}</span><input value="${esc(x.valor)}" style="flex:0 0 110px"><button onclick="gCfg('${x.clave}',this)">Guardar</button></div>`).join('')+'<p class="mu">Horas en formato HH:MM; montos y horas de cancelación en números enteros.</p>';
}
async function gCfg(k,b){
 const v=b.closest('.rw').querySelector('input').value.trim(),h=/^(hora_|limite_)/.test(k);
 if(!(h?/^([01]\d|2[0-3]):[0-5]\d$/:/^\d+$/).test(v))return msg(h?'Usa el formato HH:MM':'Escribe un número entero',1);
 const {data:{session}}=await sb.auth.getSession();
 const {error}=await sb.from('configuracion').update({valor:v,actualizado_por:session.user.id,actualizado_en:new Date().toISOString()}).eq('clave',k);
 if(!error)S.cfg[k]=v;er(error,'Guardado');
}
async function pUsu(){
 const {data:{session}}=await sb.auth.getSession(),yo=session.user.id,sy=S.perfil.rol==='sysadmin',R=ROLES.filter(r=>sy||r!=='sysadmin');
 const {data}=await sb.from('perfiles').select('id,nombre_completo,usuario,rol,activo').order('nombre_completo');
 $('#pc').innerHTML=`<h4 style="margin-top:0">Nuevo usuario</h4><div class="rw"><input id="un" placeholder="Nombre Apellido"><select id="ur">${R.map(r=>`<option>${r}</option>`).join('')}</select><input id="uc" type="password" placeholder="Clave (mín. 6)"><button class="p" onclick="crearU()">Crear</button></div><h4>Usuarios</h4>${(data||[]).map(x=>{const bl=x.id===yo||(x.rol==='sysadmin'&&!sy);return`<div class="rw"><span style="flex:1 1 40%">${esc(x.nombre_completo)}<br><span class="mu">${esc(x.usuario)}</span></span>${bl?`<span class="mu">${x.rol}${x.id===yo?' (tú)':''}</span>`:`${SO('rol',R.map(r=>[r,r]),x.rol)}${CK('activo',x.activo,'Activo')}<button onclick="gd('perfiles','${x.id}',this)">Guardar</button><button onclick="claveU('${x.id}')">Clave</button>`}</div>`}).join('')}`;
}
async function fn(body){const {data,error}=await sb.functions.invoke('crear_usuario',{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
async function crearU(){const n=$('#un').value.trim();if(!n||$('#uc').value.length<6)return msg('Falta el nombre o la clave es muy corta',1);try{await fn({accion:'crear',nombre_completo:n,rol:$('#ur').value,clave:$('#uc').value});msg('Usuario creado');pUsu()}catch(e){msg(e.message,1)}}
async function claveU(id){const c=prompt('Nueva clave (mínimo 6 caracteres):');if(!c)return;try{await fn({accion:'cambiar_clave',usuario_id:id,clave:c});msg('Clave cambiada')}catch(e){msg(e.message,1)}}
// ---------- Catálogo de unidades ----------
const FU=p=>sb.storage.from('fotos_unidades').getPublicUrl(p).data.publicUrl;
let CAT=[],CF={e:'',s:''},G=null,catTk=0;
async function abrirCatalogo(){
 const {data,error}=await sb.from('catalogo_unidades').select('*').order('edificio_orden').order('tipo');
 if(error)return msg(error.message,1);
 CAT=data||[];CF.e=hoyStr();CF.s=addD(CF.e,1);
 $('#cat').innerHTML=`<div class="ch"><h3>🏨 Catálogo de unidades</h3><label>Llegada<input type="date" id="cle" value="${CF.e}" onchange="catFechas('e')"></label><label>Salida<input type="date" id="cls" value="${CF.s}" onchange="catFechas('s')"></label><button onclick="cerrarCatalogo()">✕ Cerrar</button></div><div class="cb"><div id="cgr"></div></div>`;
 $('#cat').style.display='flex';catDibujar();
}
function cerrarCatalogo(){galCerrar();$('#cat').style.display='none'}
function catFechas(w){
 let e=$('#cle').value,s=$('#cls').value;
 if(!e||!s){$('#cle').value=CF.e;$('#cls').value=CF.s;return}
 if(s<=e){if(w==='e')s=addD(e,1);else e=addD(s,-1)}
 CF.e=e;CF.s=s;$('#cle').value=e;$('#cls').value=s;catDibujar();
}
async function catDibujar(){
 const tk=++catTk,{data,error}=await sb.from('reservas').select('unidad_id').lt('fecha_entrada',CF.s).gt('fecha_salida',CF.e).in('estado',['tentativa','confirmada','en_casa','bloqueado']);
 if(tk!==catTk)return;if(error)return msg(error.message,1);
 const oc=new Set((data||[]).map(x=>x.unidad_id));let ed=null,h='';
 CAT.forEach((c,k)=>{
  if(c.edificio!==ed){ed=c.edificio;h+=`<h4 style="grid-column:1/-1;margin:8px 0 0">${esc(ed)}</h4>`}
  const us=S.unidades.filter(u=>u.edificios.nombre===c.edificio&&(u.tipos_unidad?.nombre||'')===c.tipo),lib=us.filter(u=>!oc.has(u.id));
  c._ids=us[0]?{t:us[0].tipo_unidad_id||'',e:us[0].edificio_id}:null;
  const f=c.fotos||[],im=(x,i)=>`<img src="${FU(x)}" onclick="abrirGal(${k},${i})">`;
  const tag=!us.length?'<span class="dis nd">Sin datos de disponibilidad</span>':lib.length?`<span class="dis ok">${lib.length} de ${us.length} disponibles</span>`:'<span class="dis no">No disponible</span>';
  h+=`<div class="cat">${f.length?`<div class="ph">${f.slice(0,4).map(im).join('')}</div>`:'<div class="ph vacio">Sin fotos</div>'}<b>${esc(c.tipo)}</b> <span class="mu">${c.cantidad} unidad${c.cantidad>1?'es':''}</span>
  <div class="mu">${[c.camas?c.camas+' cama'+(c.camas>1?'s':''):'',c.detalle_camas,'hasta '+c.max_adultos+' adultos'+(c.max_menores?' + '+c.max_menores+' menores':'')].filter(Boolean).map(esc).join(' · ')}</div>
  ${c.descripcion?`<p>${esc(c.descripcion)}</p>`:''}<div>${tag}</div>${lib.length?`<div class="mu">Libres: ${lib.map(u=>esc(u.codigo)).join(', ')}</div>`:''}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="dinero"><b>${clp(c.tarifa_base)}</b> <span class="mu">por noche</span></div><button class="p" ${c._ids?'':'disabled'} onclick="catReservar(${k})">＋ Reservar</button></div></div>`});
 $('#cgr').innerHTML=`<div class="cg">${h||'<p class="mu">Aún no hay unidades con categoría.</p>'}</div>`;
}
function catReservar(k){const i=CAT[k]._ids;if(!i)return;const e=CF.e,s=CF.s;cerrarCatalogo();abrirNueva({tipo:i.t,edificio:i.e,entrada:e,salida:s})}
// Galería a pantalla completa
function abrirGal(k,i){G={f:CAT[k].fotos||[],i,n:CAT[k].tipo};galDibujar();$('#gal').style.display='flex'}
function galDibujar(){
 $('#gal').innerHTML=`<div class="gt"><b>${esc(G.n)} · ${G.i+1}/${G.f.length}</b><button onclick="galCerrar()">✕ Cerrar</button></div><div class="gm">${G.f.length>1?'<button class="fl" style="left:12px" onclick="galMover(-1)">‹</button>':''}<img src="${FU(G.f[G.i])}">${G.f.length>1?'<button class="fl" style="right:12px" onclick="galMover(1)">›</button>':''}</div><div class="th">${G.f.map((x,j)=>`<img class="${j===G.i?'on':''}" src="${FU(x)}" onclick="G.i=${j};galDibujar()">`).join('')}</div>`;
 $('#gal .th img.on')?.scrollIntoView({inline:'center',block:'nearest'});
}
function galMover(d){if(!G||G.f.length<2)return;G.i=(G.i+d+G.f.length)%G.f.length;galDibujar()}
function galCerrar(){G=null;$('#gal').style.display='none'}
document.addEventListener('keydown',e=>{
 if(G){if(e.key==='Escape'){galCerrar();e.stopPropagation()}else if(e.key==='ArrowLeft')galMover(-1);else if(e.key==='ArrowRight')galMover(1);return}
 if(e.key==='Escape'&&$('#cat').style.display==='flex')cerrarCatalogo();
});
async function pDet(id){
 const {data:t}=await sb.from('tipos_unidad').select('*').eq('id',id).single(),f=t.fotos||[];
 $('#pc').innerHTML=`<button onclick="panel('tipos')">← Categorías</button><h4>${esc(t.nombre)}</h4><div class="rw" id="dt">${NI('camas',t.camas,'N° de camas','number')}${NI('detalle_camas',t.detalle_camas,'Detalle (ej. 1 matrimonial + 1 sofá cama)')}</div><label style="margin-top:8px">Descripción<textarea id="dd" rows="3">${esc(t.descripcion)}</textarea></label><button class="p" style="margin-top:6px" onclick="gDet('${id}')">Guardar detalle</button>
 <h4>Fotos (${f.length})</h4><div class="ph" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${f.map((x,i)=>`<div style="position:relative"><img src="${FU(x)}" style="height:90px"><button style="position:absolute;top:2px;right:2px;padding:0 6px" onclick="delFoto('${id}',${i})">✕</button></div>`).join('')}</div><input type="file" id="ff" accept="image/*" multiple> <button onclick="subirFotos('${id}')">Subir fotos</button><p class="mu">Máximo 5 MB por foto. Se ven en el catálogo de recepción.</p>`;
}
async function gDet(id){const o=datos($('#dt'));o.descripcion=$('#dd').value||null;const {error}=await sb.from('tipos_unidad').update(o).eq('id',id);er(error,'Detalle guardado')}
async function subirFotos(id){
 const fs=[...$('#ff').files];if(!fs.length)return msg('Elige una o más fotos',1);
 const {data:t}=await sb.from('tipos_unidad').select('fotos').eq('id',id).single(),n=t.fotos||[];
 for(const f of fs){if(f.size>5e6){msg(f.name+' pesa más de 5 MB',1);continue}const p=id+'/'+Date.now()+'-'+f.name.replace(/[^\w.]+/g,'_'),{error}=await sb.storage.from('fotos_unidades').upload(p,f,{contentType:f.type});if(error){msg(error.message,1);continue}n.push(p)}
 const {error}=await sb.from('tipos_unidad').update({fotos:n}).eq('id',id);er(error,'Fotos subidas');pDet(id)}
async function delFoto(id,i){
 if(!confirm('¿Quitar esta foto?'))return;const {data:t}=await sb.from('tipos_unidad').select('fotos').eq('id',id).single(),n=t.fotos||[],[p]=n.splice(i,1);
 await sb.storage.from('fotos_unidades').remove([p]);const {error}=await sb.from('tipos_unidad').update({fotos:n}).eq('id',id);er(error,'Foto eliminada');pDet(id)}
// ---------- Buscador ----------
function abrirBuscar(){
 $('#mo').innerHTML=`<div style="width:780px"><div style="display:flex;justify-content:space-between"><h3 style="margin:0 0 10px">🔍 Buscar reserva</h3><button onclick="cerrar()">✕</button></div><div class="sec c1"><h4 class="st">Búsqueda en todos los edificios</h4><input id="bq" style="width:100%;box-sizing:border-box" placeholder="Nombre o apellido, UID (R-… / H-…), teléfono o documento" oninput="buscarR()"></div><div id="br"></div></div>`;
 $('#mo').style.display='grid';$('#bq').focus();
}
let bt2;function buscarR(){clearTimeout(bt2);bt2=setTimeout(async()=>{
 const q=$('#bq').value.trim();if(q.length<2){$('#br').innerHTML='';return}
 const {data,error}=await sb.rpc('buscar_reservas',{p_texto:q});if(error)return msg(error.message,1);
 $('#br').innerHTML=(data||[]).map(x=>`<div class="cand" onclick="irReserva('${x.reserva_id}')"><b>${esc(x.huesped)}</b> <span class="mu">${esc(x.uid_huesped)} · ${esc(x.uid_reserva)}</span><br><span class="mu">${esc(x.edificio)} ${esc(x.unidad)} · ${x.fecha_entrada} → ${x.fecha_salida} · ${x.estado.replace('_',' ')}${x.telefono?' · '+esc(x.telefono):''}</span></div>`).join('')||'<p class="mu">Sin resultados</p>'},300)}
function irReserva(id){cerrar();abrirDr(id)}
iniciar();
</script></body></html>
